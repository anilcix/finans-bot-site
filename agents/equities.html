<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests"><title>Hisse / Emtia — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>.fund-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.fund-item{border:1px solid var(--green-dim);border-radius:10px;padding:10px}.fund-name{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.fund-val{font-size:17px;font-weight:800;margin-top:5px}.fund-src{font-size:8px;color:var(--muted);margin-top:5px;line-height:1.45}.verified{color:#39ff88}.unverified{color:#ffcf5c}.fund-card{border:1px solid rgba(57,255,136,.16);border-radius:12px;margin-top:10px;overflow:hidden}.fund-card summary{cursor:pointer;list-style:none;padding:13px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.fund-card summary::-webkit-details-marker{display:none}.fund-card[open] summary{border-bottom:1px solid rgba(57,255,136,.12)}.fund-title{font-size:13px;font-weight:800}.fund-meta{font-size:9px;color:var(--muted);margin-top:3px}.score-pill{border:1px solid var(--green-dim);border-radius:999px;padding:5px 8px;font-size:9px;white-space:nowrap}.checks{padding:10px 14px 14px}.check{font-size:9px;color:var(--muted);line-height:1.6}.policy{font-size:10px;line-height:1.65;color:var(--muted)}.section-badge{display:inline-block;margin-left:6px;font-size:8px;border:1px solid var(--green-dim);border-radius:999px;padding:2px 6px;color:var(--muted)}.bist-search-wrap{margin-top:12px}.bist-search{width:100%;box-sizing:border-box;background:rgba(4,14,9,.85);border:1px solid var(--green-dim);border-radius:10px;padding:12px 13px;color:var(--text);font:inherit;outline:none}.bist-search:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(57,255,136,.08)}.bist-search-meta{font-size:9px;color:var(--muted);margin-top:7px}.bist-assets{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.bist-asset{border:1px solid rgba(57,255,136,.16);border-radius:10px;padding:10px;cursor:pointer;background:rgba(8,22,14,.35);transition:.15s}.bist-asset:hover{border-color:rgba(57,255,136,.45);transform:translateY(-1px)}.bist-code{font-size:13px;font-weight:800}.bist-name{font-size:9px;color:var(--muted);margin-top:3px;min-height:24px}.bist-price{font-size:12px;font-weight:700;margin-top:7px}.bist-day{font-size:9px;margin-top:2px}.hidden-by-search{display:none!important}.bist-empty{padding:18px 0;color:var(--muted);font-size:10px}.bist-fund-header{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}@media(max-width:950px){.bist-assets{grid-template-columns:repeat(3,1fr)}}@media(max-width:850px){.fund-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.bist-assets{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.fund-grid{grid-template-columns:1fr}.fund-card summary{align-items:flex-start;flex-direction:column}.bist-assets{grid-template-columns:1fr 1fr}}</style><script data-security-frameguard>try{if(window.top!==window.self){window.top.location=window.self.location.href}}catch(e){document.documentElement.style.display="none"}</script></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>📈 HİSSE / EMTİA</h1><p>ABD AI / Tech · BIST · Doğrulanmış Temel Analiz · Emtia</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
function table(rows,currency='$'){return `<div class="table-wrap"><table class="data-table"><tr><th>Varlık</th><th>Fiyat</th><th>Günlük</th></tr>${rows.map(x=>`<tr><td>${x.label}<div class="note">${x.symbol}</div></td><td>${x.price==null?'—':currency+Number(x.price).toLocaleString('tr-TR',{maximumFractionDigits:2})}</td><td class="${x.change_pct>=0?'positive':'negative'}">${x.change_pct==null?'—':(x.change_pct>=0?'+':'')+Number(x.change_pct).toFixed(2)+'%'}</td></tr>`).join('')}</table></div>`}
function money(v,c='$'){if(v==null)return'—';v=Number(v);const a=Math.abs(v),s=v<0?'−':'';if(a>=1e12)return s+c+(a/1e12).toFixed(2)+'T';if(a>=1e9)return s+c+(a/1e9).toFixed(2)+'B';if(a>=1e6)return s+c+(a/1e6).toFixed(1)+'M';return s+c+a.toLocaleString('tr-TR',{maximumFractionDigits:0})}
function pct(v){return v==null?'—':`${Number(v)>=0?'+':''}${Number(v).toFixed(1)}%`}
function num(v,d=2){return v==null?'—':Number(v).toFixed(d)}
function norm(s){return String(s||'').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function metric(m,label,fmt){m=m||{};const ok=!!m.verified;return `<div class="fund-item"><div class="fund-name">${label}</div><div class="fund-val ${ok?'verified':'unverified'}">${m.value==null?'—':fmt(m.value)}</div><div class="fund-src">${ok?'✓ Doğrulandı':'⚠ Doğrulanamadı'}${m.period?' · '+m.period:''}<br>${m.source||'Kaynak yok'}${m.note?' · '+m.note:''}</div></div>`}
function usFundamentals(rows){if(!rows?.length)return'<div class="empty">Temel analiz verisi yok.</div>';return rows.map(x=>{const m=x.metrics||{},checks=x.checks||[],score=x.score==null?'—':Number(x.score).toFixed(0)+'/100';return `<details class="fund-card"><summary><div><div class="fund-title">${x.label||x.company||x.symbol} <span class="note">${x.symbol}</span></div><div class="fund-meta">SEC CIK ${x.cik||'—'} · Doğrulama %${x.verification_rate_pct??0}</div></div><span class="score-pill">Temel kalite: ${score} · ${x.score_label||'—'}</span></summary>${x.error?`<div class="checks unverified">⚠ ${x.error}</div>`:`<div class="fund-grid">${metric(m.revenue_growth_yoy_pct,'Gelir büyümesi YoY',pct)}${metric(m.net_margin_pct,'Net kâr marjı',pct)}${metric(m.operating_margin_pct,'Faaliyet marjı',pct)}${metric(m.fcf_margin_pct,'FCF marjı',pct)}${metric(m.free_cash_flow,'Serbest nakit akışı',v=>money(v,'$'))}${metric(m.cash,'Nakit',v=>money(v,'$'))}${metric(m.debt,'Toplam borç',v=>money(v,'$'))}${metric(m.debt_to_equity,'Borç / Özkaynak',v=>num(v,2)+'x')}${metric(m.current_ratio,'Cari oran',v=>num(v,2)+'x')}${metric(m.pe_fy,'F/K · son FY',v=>num(v,1)+'x')}</div><div class="checks">${checks.map(c=>`<div class="check ${c.passed?'verified':'unverified'}">${c.passed?'✓':'⚠'} ${c.name}${c.period?' · '+c.period:''}${c.value_pct!=null?' · fark %'+Number(c.value_pct).toFixed(2):''} · ${c.rule||''}</div>`).join('')}</div>`}</details>`}).join('')}
function bistAssets(rows){if(!rows?.length)return'<div class="bist-empty">BIST varlığı bulunamadı.</div>';return `<div id="bistAssetGrid" class="bist-assets">${rows.map(x=>`<div class="bist-asset" data-symbol="${x.symbol}" data-label="${x.label||''}" onclick="selectBist('${x.symbol}')"><div class="bist-code">${x.symbol}</div><div class="bist-name">${x.label||''}</div><div class="bist-price">${x.price==null?'—':'₺'+Number(x.price).toLocaleString('tr-TR',{maximumFractionDigits:2})}</div><div class="bist-day ${x.change_pct>=0?'positive':'negative'}">${x.change_pct==null?'—':(x.change_pct>=0?'+':'')+Number(x.change_pct).toFixed(2)+'%'}</div></div>`).join('')}</div><div id="bistNoResult" class="bist-empty" style="display:none">Aramana uyan BIST varlığı bulunamadı.</div>`}
function bistFundamentals(rows){if(!rows?.length)return'<div class="empty">BIST temel analiz verisi yok.</div>';return `<div id="bistFundList">${rows.map(x=>{const search=`${x.symbol} ${x.label||''} ${x.company||''}`;if(x.model==='bank')return `<details id="bist-${x.symbol}" class="fund-card bist-fund-card" data-search="${search}"><summary><div><div class="fund-title">${x.label||x.symbol} <span class="note">${x.symbol}</span></div><div class="fund-meta">Banka · ayrı model gerekli</div></div><span class="score-pill">${x.score_label||'Banka modeli gerekli'}</span></summary><div class="checks unverified">⚠ ${x.note||'Bankalar sanayi şirketi oranlarıyla analiz edilmez.'}</div></details>`;const m=x.metrics||{},checks=x.checks||[],score=x.score==null?'—':Number(x.score).toFixed(0)+'/100';return `<details id="bist-${x.symbol}" class="fund-card bist-fund-card" data-search="${search}"><summary><div><div class="fund-title">${x.label||x.company||x.symbol} <span class="note">${x.symbol}</span></div><div class="fund-meta">KAP · son dönem ${x.latest_period||'—'} · Doğrulama %${x.verification_rate_pct??0}</div></div><span class="score-pill">Temel kalite: ${score} · ${x.score_label||'—'}</span></summary>${x.error?`<div class="checks unverified">⚠ ${x.error}</div>`:`<div class="fund-grid">${metric(m.revenue,'Hasılat / Satış',v=>money(v,'₺'))}${metric(m.net_income,'Net dönem kârı',v=>money(v,'₺'))}${metric(m.gross_margin_pct,'Brüt marj',pct)}${metric(m.operating_margin_pct,'Faaliyet marjı',pct)}${metric(m.net_margin_pct,'Net kâr marjı',pct)}${metric(m.cash,'Nakit',v=>money(v,'₺'))}${metric(m.liabilities_to_equity,'Yükümlülük / Özkaynak',v=>num(v,2)+'x')}${metric(m.current_ratio,'Cari oran',v=>num(v,2)+'x')}${metric(m.annual_revenue_growth_pct,'Yıllık gelir büyümesi · referans',pct)}${metric(m.price_try,'Hisse fiyatı',v=>'₺'+Number(v).toLocaleString('tr-TR',{maximumFractionDigits:2}))}</div><div class="checks">${checks.map(c=>`<div class="check ${c.passed?'verified':'unverified'}">${c.passed?'✓':'⚠'} ${c.name}${c.value_pct!=null?' · fark %'+Number(c.value_pct).toFixed(2):''} · ${c.rule||''}</div>`).join('')}${x.source_warning?`<div class="check unverified">⚠ ${x.source_warning}</div>`:''}${x.kap_url?`<div class="check"><a href="${x.kap_url}" target="_blank" rel="noopener">KAP finansal sayfasını aç ↗</a></div>`:''}</div>`}</details>`}).join('')}</div>`}
function src(d){const p=d?.fundamental_policy||{},b=d?.bist_policy||{};return `<div class="card source-card"><h2>Veri ve Doğrulama Politikası</h2><div class="source-list"><div class="source-item"><div class="source-label">ABD Finansalları</div><div class="source-value">${p.primary_source||'SEC Companyfacts / XBRL'}.</div></div><div class="source-item"><div class="source-label">BIST Finansalları</div><div class="source-value">${b.primary_source||'KAP resmi şirket finansal bilgileri'}.</div></div><div class="source-item"><div class="source-label">BIST doğrulama</div><div class="source-value">${b.verification||'Ticker eşleşmesi + aynı dönem oranları + bilanço eşitliği.'}</div></div><div class="source-item"><div class="source-label">Banka notu</div><div class="source-value">${b.bank_note||'Bankalar için ayrı temel analiz modeli gerekir.'}</div></div></div></div>`}
function filterBist(){const q=norm(document.getElementById('bistSearch')?.value||'');let visibleAssets=0;document.querySelectorAll('.bist-asset').forEach(el=>{const ok=!q||norm((el.dataset.symbol||'')+' '+(el.dataset.label||'')).includes(q);el.classList.toggle('hidden-by-search',!ok);if(ok)visibleAssets++});let visibleFund=0;document.querySelectorAll('.bist-fund-card').forEach(el=>{const ok=!q||norm(el.dataset.search||'').includes(q);el.classList.toggle('hidden-by-search',!ok);if(ok)visibleFund++});const no=document.getElementById('bistNoResult');if(no)no.style.display=visibleAssets?'none':'block';const meta=document.getElementById('bistSearchMeta');if(meta)meta.textContent=q?`${visibleAssets} varlık · ${visibleFund} temel analiz kartı eşleşti`:`${document.querySelectorAll('.bist-asset').length} BIST varlığı gösteriliyor`}
function selectBist(symbol){const input=document.getElementById('bistSearch');if(input){input.value=symbol;filterBist()}const card=document.getElementById('bist-'+symbol);if(card){card.classList.remove('hidden-by-search');card.open=true;setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'center'}),50)}}
async function load(){try{let d=await(await fetch('../data/equities.json?t='+Date.now())).json();updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');content.innerHTML=`<div class="card"><h2>ABD AI / Tech</h2>${table(d.tech||[],'$')}</div><div class="card"><h2>📊 ABD Temel Analiz <span class="section-badge">SEC</span></h2>${usFundamentals(d.fundamentals||[])}</div><div class="card"><div class="bist-fund-header"><h2>🇹🇷 BIST Varlıkları</h2><span class="section-badge">${(d.bist||[]).length} hisse</span></div><div class="policy">Kod veya şirket adıyla ara. Bir varlığa tıklarsan aşağıdaki temel analiz kartı açılır.</div><div class="bist-search-wrap"><input id="bistSearch" class="bist-search" type="search" placeholder="Örn: ASELS, Aselsan, THYAO, Pegasus, Akbank…" autocomplete="off" oninput="filterBist()"><div id="bistSearchMeta" class="bist-search-meta">${(d.bist||[]).length} BIST varlığı gösteriliyor</div></div>${bistAssets(d.bist||[])}</div><div class="card"><h2>🇹🇷 BIST Temel Analiz <span class="section-badge">KAP</span> ${tip('KAP resmi şirket finansal bilgilerinden aynı dönem oranları ve bilanço eşitliği kontrolüyle hesaplanır. Doğrulanamayan veri skora girmez.')}</h2><div class="policy">Arama kutusu bu kartları da filtreler. BIST büyüme oranları KAP özet sayfasındaki geçmiş dönem düzeltme uyarısı nedeniyle yalnız referans gösterilir.</div>${bistFundamentals(d.bist_fundamentals||[])}</div><div class="card"><h2>Emtia</h2>${table(d.commodities||[],'$')}</div>`+src(d)}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+src(null)}}load()</script></body></html>
