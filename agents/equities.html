<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://project-alpha-terminal.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests"><title>Hisse / Emtia — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>.fund-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.fund-item{border:1px solid var(--green-dim);border-radius:10px;padding:10px}.fund-name{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.fund-val{font-size:17px;font-weight:800;margin-top:5px}.fund-src{font-size:8px;color:var(--muted);margin-top:5px;line-height:1.45}.verified{color:#39ff88}.unverified{color:#ffcf5c}.fund-card{border:1px solid rgba(57,255,136,.16);border-radius:12px;margin-top:10px;overflow:hidden}.fund-card summary{cursor:pointer;list-style:none;padding:13px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.fund-card summary::-webkit-details-marker{display:none}.fund-card[open] summary{border-bottom:1px solid rgba(57,255,136,.12)}.fund-title{font-size:13px;font-weight:800}.fund-meta{font-size:9px;color:var(--muted);margin-top:3px}.score-pill{border:1px solid var(--green-dim);border-radius:999px;padding:5px 8px;font-size:9px;white-space:nowrap}.checks{padding:10px 14px 14px}.check{font-size:9px;color:var(--muted);line-height:1.6}.policy{font-size:10px;line-height:1.65;color:var(--muted)}.section-badge{display:inline-block;margin-left:6px;font-size:8px;border:1px solid var(--green-dim);border-radius:999px;padding:2px 6px;color:var(--muted)}.bist-search-wrap{margin-top:12px}.bist-search{width:100%;box-sizing:border-box;background:rgba(4,14,9,.85);border:1px solid var(--green-dim);border-radius:10px;padding:12px 13px;color:var(--text);font:inherit;outline:none}.bist-search:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(57,255,136,.08)}.bist-search-meta{font-size:9px;color:var(--muted);margin-top:7px}.bist-assets{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.bist-asset{border:1px solid rgba(57,255,136,.16);border-radius:10px;padding:10px;cursor:pointer;background:rgba(8,22,14,.35);transition:.15s}.bist-asset:hover{border-color:rgba(57,255,136,.45);transform:translateY(-1px)}.bist-code{font-size:13px;font-weight:800}.bist-name{font-size:9px;color:var(--muted);margin-top:3px;min-height:24px}.bist-price{font-size:12px;font-weight:700;margin-top:7px}.bist-day{font-size:9px;margin-top:2px}.hidden-by-search{display:none!important}.bist-empty{padding:18px 0;color:var(--muted);font-size:10px}.bist-fund-header{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}@media(max-width:950px){.bist-assets{grid-template-columns:repeat(3,1fr)}}@media(max-width:850px){.fund-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.bist-assets{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.fund-grid{grid-template-columns:1fr}.fund-card summary{align-items:flex-start;flex-direction:column}.bist-assets{grid-template-columns:1fr 1fr}}</style><script data-security-frameguard>try{if(window.top!==window.self){window.top.location=window.self.location.href}}catch(e){document.documentElement.style.display="none"}</script></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>📈 HİSSE / EMTİA</h1><p>ABD AI / Tech · BIST · Doğrulanmış Temel Analiz · Emtia</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
function table(rows,currency='$'){return `<div class="table-wrap"><table class="data-table"><tr><th>Varlık</th><th>Fiyat</th><th>Günlük</th></tr>${rows.map(x=>`<tr><td>${x.label}<div class="note">${x.symbol}</div></td><td>${x.price==null?'—':currency+Number(x.price).toLocaleString('tr-TR',{maximumFractionDigits:2})}</td><td class="${x.change_pct>=0?'positive':'negative'}">${x.change_pct==null?'—':(x.change_pct>=0?'+':'')+Number(x.change_pct).toFixed(2)+'%'}</td></tr>`).join('')}</table></div>`}
function money(v,c='$'){if(v==null)return'—';v=Number(v);const a=Math.abs(v),s=v<0?'−':'';if(a>=1e12)return s+c+(a/1e12).toFixed(2)+'T';if(a>=1e9)return s+c+(a/1e9).toFixed(2)+'B';if(a>=1e6)return s+c+(a/1e6).toFixed(1)+'M';return s+c+a.toLocaleString('tr-TR',{maximumFractionDigits:0})}
function pct(v){return v==null?'—':`${Number(v)>=0?'+':''}${Number(v).toFixed(1)}%`}
function num(v,d=2){return v==null?'—':Number(v).toFixed(d)}
function norm(s){return String(s||'').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function metric(m,label,fmt){m=m||{};const ok=!!m.verified;return `<div class="fund-item"><div class="fund-name">${label}</div><div class="fund-val ${ok?'verified':'unverified'}">${m.value==null?'—':fmt(m.value)}</div><div class="fund-src">${ok?'✓ Doğrulandı':'⚠ Doğrulanamadı'}${m.period?' · '+m.period:''}<br>${m.source||'Kaynak yok'}${m.note?' · '+m.note:''}</div></div>`}
function usFundamentals(rows){if(!rows?.length)return'<div class="empty">Temel analiz verisi yok.</div>';return rows.map(x=>{const m=x.metrics||{},checks=x.checks||[],score=x.score==null?'—':Number(x.score).toFixed(0)+'/100';return `<details class="fund-card"><summary><div><div class="fund-title">${x.label||x.company||x.symbol} <span class="note">${x.symbol}</span></div><div class="fund-meta">SEC CIK ${x.cik||'—'} · Doğrulama %${x.verification_rate_pct??0}</div></div><span class="score-pill">Temel kalite: ${score} · ${x.score_label||'—'}</span></summary>${x.error?`<div class="checks unverified">⚠ ${x.error}</div>`:`<div class="fund-grid">${metric(m.revenue_growth_yoy_pct,'Gelir büyümesi YoY',pct)}${metric(m.net_margin_pct,'Net kâr marjı',pct)}${metric(m.operating_margin_pct,'Faaliyet marjı',pct)}${metric(m.fcf_margin_pct,'FCF marjı',pct)}${metric(m.free_cash_flow,'Serbest nakit akışı',v=>money(v,'$'))}${metric(m.cash,'Nakit',v=>money(v,'$'))}${metric(m.debt,'Toplam borç',v=>money(v,'$'))}${metric(m.debt_to_equity,'Borç / Özkaynak',v=>num(v,2)+'x')}${metric(m.current_ratio,'Cari oran',v=>num(v,2)+'x')}${metric(m.pe_fy,'F/K · son FY',v=>num(v,1)+'x')}</div><div class="checks">${checks.map(c=>`<div class="check ${c.passed?'verified':'unverified'}">${c.passed?'✓':'⚠'} ${c.name}${c.period?' · '+c.period:''}${c.value_pct!=null?' · fark %'+Number(c.value_pct).toFixed(2):''} · ${c.rule||''}</div>`).join('')}</div>`}</details>`}).join('')}
function bistAssets(rows){if(!rows?.length)return'<div class="bist-empty">BIST varlığı bulunamadı.</div>';return `<div id="bistAssetGrid" class="bist-assets">${rows.map(x=>`<div class="bist-asset" data-symbol="${x.symbol}" data-label="${x.label||''}" onclick="selectBist('${x.symbol}')"><div class="bist-code">${x.symbol}</div><div class="bist-name">${x.label||''}</div><div class="bist-price">${x.price==null?'—':'₺'+Number(x.price).toLocaleString('tr-TR',{maximumFractionDigits:2})}</div><div class="bist-day ${x.change_pct>=0?'positive':'negative'}">${x.change_pct==null?'—':(x.change_pct>=0?'+':'')+Number(x.change_pct).toFixed(2)+'%'}</div></div>`).join('')}</div><div id="bistNoResult" class="bist-empty" style="display:none">Aramana uyan BIST varlığı bulunamadı.</div>`}
function bistFundamentals(rows){if(!rows?.length)return'<div class="empty">BIST temel analiz verisi yok.</div>';return `<div id="bistFundList">${rows.map(x=>{const search=`${x.symbol} ${x.label||''} ${x.company||''}`;if(x.model==='bank')return `<details id="bist-${x.symbol}" class="fund-card bist-fund-card" data-search="${search}"><summary><div><div class="fund-title">${x.label||x.symbol} <span class="note">${x.symbol}</span></div><div class="fund-meta">Banka · ayrı model gerekli</div></div><span class="score-pill">${x.score_label||'Banka modeli gerekli'}</span></summary><div class="checks unverified">⚠ ${x.note||'Bankalar sanayi şirketi oranlarıyla analiz edilmez.'}</div></details>`;const m=x.metrics||{},checks=x.checks||[],score=x.score==null?'—':Number(x.score).toFixed(0)+'/100';return `<details id="bist-${x.symbol}" class="fund-card bist-fund-card" data-search="${search}"><summary><div><div class="fund-title">${x.label||x.company||x.symbol} <span class="note">${x.symbol}</span></div><div class="fund-meta">KAP · son dönem ${x.latest_period||'—'} · Doğrulama %${x.verification_rate_pct??0}</div></div><span class="score-pill">Temel kalite: ${score} · ${x.score_label||'—'}</span></summary>${x.error?`<div class="checks unverified">⚠ ${x.error}</div>`:`<div class="fund-grid">${metric(m.revenue,'Hasılat / Satış',v=>money(v,'₺'))}${metric(m.net_income,'Net dönem kârı',v=>money(v,'₺'))}${metric(m.gross_margin_pct,'Brüt marj',pct)}${metric(m.operating_margin_pct,'Faaliyet marjı',pct)}${metric(m.net_margin_pct,'Net kâr marjı',pct)}${metric(m.cash,'Nakit',v=>money(v,'₺'))}${metric(m.liabilities_to_equity,'Yükümlülük / Özkaynak',v=>num(v,2)+'x')}${metric(m.current_ratio,'Cari oran',v=>num(v,2)+'x')}${metric(m.annual_revenue_growth_pct,'Yıllık gelir büyümesi · referans',pct)}${metric(m.price_try,'Hisse fiyatı',v=>'₺'+Number(v).toLocaleString('tr-TR',{maximumFractionDigits:2}))}</div><div class="checks">${checks.map(c=>`<div class="check ${c.passed?'verified':'unverified'}">${c.passed?'✓':'⚠'} ${c.name}${c.value_pct!=null?' · fark %'+Number(c.value_pct).toFixed(2):''} · ${c.rule||''}</div>`).join('')}${x.source_warning?`<div class="check unverified">⚠ ${x.source_warning}</div>`:''}${x.kap_url?`<div class="check"><a href="${x.kap_url}" target="_blank" rel="noopener">KAP finansal sayfasını aç ↗</a></div>`:''}</div>`}</details>`}).join('')}</div>`}
function src(d){const p=d?.fundamental_policy||{},b=d?.bist_policy||{};return `<div class="card source-card"><h2>Veri ve Doğrulama Politikası</h2><div class="source-list"><div class="source-item"><div class="source-label">ABD Finansalları</div><div class="source-value">${p.primary_source||'SEC Companyfacts / XBRL'}.</div></div><div class="source-item"><div class="source-label">BIST Finansalları</div><div class="source-value">${b.primary_source||'KAP resmi şirket finansal bilgileri'}.</div></div><div class="source-item"><div class="source-label">BIST doğrulama</div><div class="source-value">${b.verification||'Ticker eşleşmesi + aynı dönem oranları + bilanço eşitliği.'}</div></div><div class="source-item"><div class="source-label">Banka notu</div><div class="source-value">${b.bank_note||'Bankalar için ayrı temel analiz modeli gerekir.'}</div></div></div></div>`}
function filterBist(){const q=norm(document.getElementById('bistSearch')?.value||'');let visibleAssets=0;document.querySelectorAll('.bist-asset').forEach(el=>{const ok=!q||norm((el.dataset.symbol||'')+' '+(el.dataset.label||'')).includes(q);el.classList.toggle('hidden-by-search',!ok);if(ok)visibleAssets++});let visibleFund=0;document.querySelectorAll('.bist-fund-card').forEach(el=>{const ok=!q||norm(el.dataset.search||'').includes(q);el.classList.toggle('hidden-by-search',!ok);if(ok)visibleFund++});const no=document.getElementById('bistNoResult');if(no)no.style.display=visibleAssets?'none':'block';const meta=document.getElementById('bistSearchMeta');if(meta)meta.textContent=q?`${visibleAssets} varlık · ${visibleFund} temel analiz kartı eşleşti`:`${document.querySelectorAll('.bist-asset').length} BIST varlığı gösteriliyor`}
function selectBist(symbol){const input=document.getElementById('bistSearch');if(input){input.value=symbol;filterBist()}const card=document.getElementById('bist-'+symbol);if(card){card.classList.remove('hidden-by-search');card.open=true;setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'center'}),50)}}


const sectorColors=['#39ff88','#ffcc66','#5cc8ff','#ff7c92','#c49bff','#ff9856','#72e6ce','#e6e66a','#9fb6ff','#fa81da','#b6e87a','#ffb0b0'];
function sectorTrendCard(data,market,title){
 const rows=data?.[market]||[],ok=rows.filter(x=>x.points?.length),missing=rows.filter(x=>!x.points?.length);
 const ranking=[...ok].sort((a,b)=>(b.change_period_pct??-999)-(a.change_period_pct??-999));
 return '<div class="card"><h2>'+title+' · Sektörel Trend Karşılaştırması</h2><div class="policy">Son 6 ay · Başlangıç 100 · Bütün sektörler tek grafikte. Sektör adlarına tıklayarak çizgileri açıp kapatabilirsin. ABD sektör ETF, BIST sektör endeksidir.</div>'+
 (ok.length?'<div id="sectorLegend-'+market+'" style="display:flex;gap:7px;flex-wrap:wrap;margin:12px 0">'+ok.map((x,i)=>'<button type="button" data-sector="'+x.symbol+'" onclick="toggleSector(\''+market+'\',\''+x.symbol+'\')" style="cursor:pointer;border:1px solid '+sectorColors[i%sectorColors.length]+';background:#0c2217;color:'+sectorColors[i%sectorColors.length]+';border-radius:7px;padding:7px 9px;font-size:10px">'+x.label+'</button>').join('')+'</div><div id="sectorChart-'+market+'" class="sector-chart"></div><div class="table-wrap"><table class="data-table"><tr><th>Sektör</th><th>Endeks / ETF</th><th>5 işlem günü</th><th>6 aylık dönem</th><th>Son kapanış</th></tr>'+ranking.map(x=>'<tr><td>'+x.label+'</td><td>'+x.symbol+'</td><td class="'+(x.change_1w_pct>=0?'positive':'negative')+'">'+pct(x.change_1w_pct)+'</td><td class="'+(x.change_period_pct>=0?'positive':'negative')+'">'+pct(x.change_period_pct)+'</td><td>'+x.last_date+'</td></tr>').join('')+'</table></div>':'<div class="empty">Sektör tarihçesi henüz üretilemedi.</div>')+
 (missing.length?'<div class="policy">⚠ Kaynaktan yeterli tarihçe alınamayan sektörler (grafiğe eklenmedi): '+missing.map(x=>x.label+' ('+x.symbol+')').join(', ')+'</div>':'')+'</div>';
}
let sectorCache={},sectorHidden={us:new Set(),tr:new Set()};
function toggleSector(market,symbol){
 const set=sectorHidden[market];if(set.has(symbol))set.delete(symbol);else set.add(symbol);
 drawSector(market);
}
function drawSector(market){
 const rows=(sectorCache[market]||[]).filter(x=>x.points?.length);
 const host=document.getElementById('sectorChart-'+market);if(!host)return;
 const active=rows.filter(x=>!sectorHidden[market].has(x.symbol));
 document.querySelectorAll('#sectorLegend-'+market+' [data-sector]').forEach(el=>el.style.opacity=sectorHidden[market].has(el.dataset.sector)?'.35':'1');
 if(!active.length){host.innerHTML='<div class="empty">Gösterilecek sektör seçilmedi.</div>';return}
 const W=960,H=300,L=55,R=20,T=20,B=35;
 const allDates=[...new Set(active.flatMap(x=>x.points.map(p=>p.date)))].sort();
 const dateIndex=new Map(allDates.map((x,i)=>[x,i]));
 const values=active.flatMap(x=>x.points.map(p=>Number(p.index))).filter(Number.isFinite);
 const lo=Math.floor((Math.min(100,...values)-2)/5)*5,hi=Math.ceil((Math.max(100,...values)+2)/5)*5,span=Math.max(1,hi-lo);
 const x=date=>L+(dateIndex.get(date)||0)*(W-L-R)/Math.max(1,allDates.length-1);
 const y=value=>T+(hi-value)/span*(H-T-B);
 const grids=[0,.25,.5,.75,1].map(t=>{const v=lo+(hi-lo)*t,yy=T+(1-t)*(H-T-B);return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="#284437" stroke-dasharray="3 5"/><text x="'+(L-7)+'" y="'+(yy+4)+'" text-anchor="end" fill="#9bb9a5" font-size="12">'+v.toFixed(0)+'</text>'}).join('');
 const lines=active.map(row=>{const i=rows.indexOf(row),color=sectorColors[i%sectorColors.length];const pts=row.points.filter(p=>Number.isFinite(Number(p.index)));const d=pts.map((p,j)=>(j?'L':'M')+x(p.date).toFixed(1)+','+y(p.index).toFixed(1)).join(' ');return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.3" stroke-linejoin="round"><title>'+row.label+' · '+row.change_period_pct+'%</title></path>'}).join('');
 host.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Sektörlerin normalize edilmiş altı aylık karşılaştırması" style="width:100%;height:auto;display:block">'+grids+'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(100)+'" y2="'+y(100)+'" stroke="#d2d2d2" stroke-dasharray="6 5" opacity=".7"/>'+lines+'<text x="'+L+'" y="'+(H-7)+'" fill="#9bb9a5" font-size="12">'+allDates[0]+'</text><text x="'+(W-R)+'" y="'+(H-7)+'" text-anchor="end" fill="#9bb9a5" font-size="12">'+allDates[allDates.length-1]+'</text></svg>';
}
function brokerFlowCard(d){
 const b=d||{},periods=[5,7,15];
 const data=b.periods||{};
 const table=(rows,label)=>'<div style="flex:1;min-width:260px"><h3>'+label+'</h3><div class="table-wrap"><table class="data-table"><tr><th>Kurum</th><th>Net lot</th><th>Net TL</th></tr>'+rows.map(x=>'<tr><td>'+String(x.broker||'—')+'</td><td>'+num(x.net_lots,0)+'</td><td>'+money(x.net_try,'₺')+'</td></tr>').join('')+'</table></div></div>';
 const panels=periods.map(days=>{
  const p=data[String(days)]||{},ready=p.status==='available'&&Array.isArray(p.buyers)&&Array.isArray(p.sellers);
  return '<div class="broker-period-panel" data-days="'+days+'" style="display:'+(days===5?'block':'none')+'">'+
   '<div class="policy">Son '+days+' işlem günü · Son veri: '+(p.as_of||'—')+' · Kaynak: '+(p.source||b.source||'Bağlı değil')+'</div>'+
   (ready?'<div style="display:flex;gap:14px;flex-wrap:wrap">'+table(p.buyers,'En çok net alanlar')+table(p.sellers,'En çok net satanlar')+'</div>':'<div class="empty">⚠ '+days+' işlem günlük doğrulanmış aracı kurum net işlem verisi henüz mevcut değil. Veri kaynağı bağlanınca sıralama gösterilecek.</div>')+'</div>';
 }).join('');
 return '<div class="card"><h2>🇹🇷 BIST · Kurum Bazlı Net Alım / Satım</h2><div class="policy">5 / 7 / 15 işlem günündeki kümülatif net alış ve satışlar. Takvim günü değil, işlem günü esas alınır. Aracı kurum dağılımı nihai yatırımcı pozisyonu veya takas değişimiyle aynı değildir.</div>'+
 '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">'+periods.map(days=>'<button type="button" class="broker-period-btn" data-days="'+days+'" onclick="selectBrokerPeriod('+days+')" style="cursor:pointer;border:1px solid #39ff88;border-radius:8px;padding:8px 13px;background:'+(days===5?'#143d26':'#08160e')+';color:#dfffea;font-weight:700">'+days+' gün</button>').join('')+'</div>'+panels+
 '<div class="policy">'+(b.note||'Doğrulanmış lisanslı kurum dağılımı verisi henüz bağlı değil.')+'</div></div>';
}
function selectBrokerPeriod(days){
 document.querySelectorAll('.broker-period-panel').forEach(el=>el.style.display=Number(el.dataset.days)===days?'block':'none');
