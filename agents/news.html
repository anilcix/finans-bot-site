<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests"><title>Haberler — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>.filters{display:flex;gap:7px;overflow:auto;padding:4px 0 12px;scrollbar-width:none}.filter{white-space:nowrap;border:1px solid rgba(57,255,136,.25);border-radius:999px;padding:7px 10px;background:transparent;color:#8ab39a;font:inherit;font-size:9px}.filter.active{color:#39ff88;border-color:#39ff88;background:rgba(57,255,136,.06)}.news-card{border:1px solid rgba(57,255,136,.16);border-radius:12px;margin-top:10px;overflow:hidden}.news-head,.news-expand{padding:13px 14px}.news-expand{display:none;border-top:1px solid rgba(57,255,136,.12)}.news-expand.open{display:block}.title{font-size:13px;font-weight:800;line-height:1.5}.title a{color:var(--text);text-decoration:none}.meta{font-size:9px;color:var(--muted);margin-top:6px;line-height:1.5}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.badge,.btn{display:inline-block;border:1px solid rgba(126,182,230,.28);border-radius:999px;padding:5px 9px;font-size:9px;color:#9fc6e8;background:transparent;text-decoration:none;font:inherit}.btn{cursor:pointer;color:#39ff88;border-color:rgba(57,255,136,.3)}.imp-high{color:#ffcf5c;border-color:rgba(255,207,92,.4)}.imp-critical{color:#ff7070;border-color:rgba(255,112,112,.45)}.full{color:#39ff88;border-color:rgba(57,255,136,.35)}.summary{font-size:11px;line-height:1.75}.label{font-size:9px;color:#7eb6e6;font-weight:800;letter-spacing:.08em;margin-bottom:6px}.sep{height:1px;background:rgba(57,255,136,.12);margin:14px 0}.agent{padding:8px 9px;border:1px solid rgba(57,255,136,.1);border-radius:8px;font-size:10px;line-height:1.65;margin-top:7px}.agent b{color:#39ff88}.headline-note{margin-top:9px;padding:9px;border:1px dashed rgba(126,182,230,.3);border-radius:8px;color:#8eafc8;font-size:9px;line-height:1.6}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.count{color:var(--muted);font-size:9px}.expert{border-color:rgba(255,207,92,.28)}@media(max-width:600px){.news-head,.news-expand{padding:12px}.title{font-size:12px}}</style><script data-security-frameguard>try{if(window.top!==window.self){window.top.location=window.self.location.href}}catch(e){document.documentElement.style.display="none"}</script></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>📰 HABER İSTİHBARATI</h1><p>Kategori · Güvenilir Kaynak · Derin Özet · Uzman Takibi · Piyasa Bağlamı</p></div><div class="container"><div id="filters" class="filters"></div><div id="stats" class="note"></div><div id="content"></div></div><script src="../help.js"></script><script>
let DATA=null,ACTIVE='ALL';const lang=()=>localStorage.getItem('marketLang')==='en'?'en':'tr',L=(tr,en)=>lang()==='tr'?tr:en;function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function dt(x){return x?new Date(x).toLocaleString(lang()==='tr'?'tr-TR':'en-US'):'—'}function story(x){return ((x.title||'')+' '+(x.article_summary_en||'')+' '+(x.article_context_en||'')).toLowerCase()}function fallbackCategory(x){const t=story(x);if(/liquidity|\btga\b|\brrp\b|repo|balance sheet|buyback/.test(t))return['LIQUIDITY',L('Likidite','Liquidity')];if(/private credit|credit spread|high yield|default|\bcds\b/.test(t))return['CREDIT',L('Kredi','Credit')];if(/options|\bvix\b|volatility|gamma|vanna|charm|0dte|opex|skew/.test(t))return['VOL_OPTIONS',L('Vol / Opsiyon','Vol / Options')];if(/treasury yield|bond yield|yield curve|rate cut|rate hike/.test(t))return['RATES',L('Faiz / Tahvil','Rates / Bonds')];if(/federal reserve|inflation|\bcpi\b|\bpce\b|payroll|unemployment|\bgdp\b|fiscal/.test(t))return['MACRO',L('Makro','Macro')];if(/bitcoin|\bbtc\b|ethereum|crypto|blockchain|stablecoin|defi|token|wallet|solana|xrp|monad/.test(t))return['CRYPTO',L('Kripto','Crypto')];if(/s&p 500|spx|nasdaq|stock market|earnings|equities/.test(t))return['EQUITIES',L('Hisse','Equities')];if(/gold|silver|oil|brent|wti|copper/.test(t))return['COMMODITIES',L('Emtia','Commodities')];if(/iran|israel|war|sanction|tariff|china|taiwan|hormuz/.test(t))return['GEOPOLITICS',L('Jeopolitik','Geopolitics')];return['GENERAL',L('Genel Piyasa','General Market')]}function cat(x){return[x.category||fallbackCategory(x)[0],x.category_label||fallbackCategory(x)[1]]}function flat(){const a=[];(DATA.topics||[]).forEach(t=>(t.items||[]).forEach(x=>{x._topic=t.label;a.push(x)}));return a.sort((a,b)=>(b.importance_score||0)-(a.importance_score||0)||String(b.published_at||'').localeCompare(String(a.published_at||'')))}function title(x){return lang()==='tr'?(x.title_tr||x.title):(x.title||x.title_tr)}function sum(x){if(!x.summary_available)return null;return lang()==='tr'?(x.article_summary_tr||x.article_summary):(x.article_summary_en||x.article_summary)}function scope(x){const t=story(x);if(/\bbitcoin\b|\bbtc\b/.test(t))return'BTC';if(/\bmonad\b/.test(t))return'MONAD';if(/solana|\bsol\b/.test(t))return'SOLANA';if(/ethereum|ether|\beth\b/.test(t))return'ETHEREUM';if(/\bxrp\b|ripple/.test(t))return'XRP';return cat(x)[1].toUpperCase()}function view(x){const c=cat(x)[0],s=scope(x);if(c==='LIQUIDITY')return[L('Bu haber likidite rejimini etkileyebilir; TGA/RRP/rezervler ve uzun vadeli faizlerle birlikte okunmalı.','This may affect the liquidity regime; read with TGA/RRP/reserves and long yields.'),L('Net likidite, DXY, tahvil faizi ve risk varlığı fiyat tepkisi aynı yönde teyit etmeli.','Net liquidity, DXY, yields and risk-asset price action should confirm.')];if(c==='CREDIT')return[L('Bu haber kredi koşulları ve finansman stresine dokunuyor; özellikle private credit ve spreadler açısından önemli olabilir.','This affects credit conditions and funding stress, especially private credit and spreads.'),L('HY/IG/CCC spreadleri, CDS ve banka/kredi hisseleri teyit vermeli.','HY/IG/CCC spreads, CDS and credit-sensitive equities should confirm.')];if(c==='VOL_OPTIONS')return[L('Bu haber opsiyon akışı ve volatilite rejimiyle ilgili; spot fiyat kadar gamma/vanna/charm konumlanması önemlidir.','This concerns options flow and the volatility regime; gamma/vanna/charm positioning matters alongside spot.'),L('VIX term structure, skew, GEX ve OI aynı hikâyeyi desteklemeli.','VIX term structure, skew, GEX and OI should support the same story.')];if(c==='CRYPTO'&&s!=='BTC')return[L(`Bu haber doğrudan ${s} / ilgili kripto ekosistemiyle ilgili; BTC için otomatik yön sinyali değildir.`,`This directly concerns ${s}/its crypto ecosystem; it is not an automatic BTC signal.`),L(`${s} fiyatı, hacim ve ilgili spot/türev akışı haberi teyit etmeli.`,`${s} price, volume and related spot/derivatives flow should confirm.`)];if(c==='CRYPTO')return[L('Bu haber doğrudan BTC/kripto risk iştahına dokunuyor; spot akış ve türev konumlanmasıyla teyit edilmeli.','This directly affects BTC/crypto risk appetite and should be confirmed by spot flow and derivatives positioning.'),L('BTC fiyatı, spot CVD, ETF akışı, OI ve funding aynı yönde teyit etmeli.','BTC price, spot CVD, ETF flow, OI and funding should confirm.')];if(c==='MACRO'||c==='RATES')return[L('Makro/faiz haberi; Fed patikası, reel faiz, DXY ve büyüme-enflasyon dengesi üzerinden piyasayı etkiler.','Macro/rates story; it works through the Fed path, real yields, DXY and the growth-inflation balance.'),L('2Y/10Y/30Y faizler, DXY ve risk varlıklarının fiyatlaması teyit vermeli.','2Y/10Y/30Y yields, DXY and risk assets should confirm.')];return[L('Bu haber ilgili varlık veya piyasa teması için bağlam sağlar; tek başına işlem sinyali değildir.','This provides context for the relevant asset/theme and is not a standalone signal.'),L('İlgili fiyat, hacim ve akış verileri aynı yönde teyit etmeli.','Relevant price, volume and flow data should confirm.')]}function card(x,i){const c=cat(x),u=x.link||x.resolved_url||'#',q=x.read_status==='full_article_read'?L('TAM HABER OKUNDU','FULL ARTICLE READ'):x.summary_available?L('KAYNAK METNİ','SOURCE TEXT'):L('SADECE BAŞLIK','HEADLINE ONLY'),imp=x.importance_score||0,impcls=imp>=75?'imp-critical':imp>=60?'imp-high':'',id='n'+i,sm=sum(x),v=view(x),expert=x.expert?`<span class="badge imp-high">${esc(x.expert)}</span>`:'';let expand='';if(sm)expand=`<div id="${id}" class="news-expand"><div class="label">${L('HABER ÖZETİ','NEWS SUMMARY')}</div><div class="summary">${esc(sm)}</div><div class="sep"></div><div class="label">${L('AJAN YORUMU','AGENT VIEW')}</div><div class="agent"><b>${L('Ne anlama geliyor:','Meaning:')}</b> ${esc(v[0])}</div><div class="agent"><b>${L('Teyit için:','Confirmation:')}</b> ${esc(v[1])}</div></div>`;return `<div class="news-card ${x.expert?'expert':''}"><div class="news-head"><div class="title"><a target="_blank" rel="noopener" href="${esc(u)}">${esc(title(x))}</a></div><div class="meta">${esc(x.source||'—')} · ${dt(x.published_at)}</div><div class="badges"><span class="badge">${esc(c[1])}</span><span class="badge">${esc(scope(x))}</span><span class="badge ${impcls}">${L('Önem','Importance')} ${imp}/100</span><span class="badge ${x.read_status==='full_article_read'?'full':''}">${q}</span>${expert}${sm?`<button class="btn" onclick="toggle('${id}',this)">${L('Özet + Yorum','Summary + View')}</button>`:''}<a class="btn" target="_blank" rel="noopener" href="${esc(u)}">${L('Kaynak','Source')}</a></div>${!sm?`<div class="headline-note">${L('Yeterli kaynak metni okunamadığı için özet ve piyasa yorumu üretilmedi.','Not enough source text was available, so no summary or market view was generated.')}</div>`:''}</div>${expand}</div>`}function toggle(id,b){const e=document.getElementById(id);if(!e)return;const o=e.classList.toggle('open');b.textContent=o?L('Kapat','Close'):L('Özet + Yorum','Summary + View')}function drawFilters(items){const cats=[['ALL',L('Tümü','All')],['CRYPTO',L('Kripto','Crypto')],['MACRO',L('Makro','Macro')],['CREDIT',L('Kredi','Credit')],['LIQUIDITY',L('Likidite','Liquidity')],['RATES',L('Faiz / Tahvil','Rates / Bonds')],['VOL_OPTIONS',L('Vol / Opsiyon','Vol / Options')],['EQUITIES',L('Hisse','Equities')],['COMMODITIES',L('Emtia','Commodities')],['GEOPOLITICS',L('Jeopolitik','Geopolitics')],['CEM',L('Cem Karsan','Cem Karsan')]];filters.innerHTML=cats.map(([k,l])=>`<button class="filter ${ACTIVE===k?'active':''}" onclick="setFilter('${k}')">${l}</button>`).join('')}function setFilter(k){ACTIVE=k;render()}function render(){if(!DATA)return;const items=flat();drawFilters(items);let show=items;if(ACTIVE==='CEM')show=items.filter(x=>x.expert==='Cem Karsan');else if(ACTIVE!=='ALL')show=items.filter(x=>cat(x)[0]===ACTIVE);stats.textContent=L(`Toplam ${items.length} içerik · ${items.filter(x=>x.summary_available).length} derin özet · ${items.filter(x=>x.expert==='Cem Karsan').length} Cem Karsan içeriği`,`Total ${items.length} items · ${items.filter(x=>x.summary_available).length} deep summaries · ${items.filter(x=>x.expert==='Cem Karsan').length} Cem Karsan items`);content.innerHTML=show.length?show.map(card).join(''):`<div class="empty">${L('Bu kategoride güncel içerik yok.','No current content in this category.')}</div>`}async function load(){try{DATA=await(await fetch('../data/news.json?t='+Date.now(),{cache:'no-store'})).json();updated.textContent=L('Güncelleme: ','Updated: ')+dt(DATA.generated_at);render()}catch(e){content.innerHTML=`<div class="error-box">⚠ ${esc(e.message)}</div>`}}window.addEventListener('market-language-changed',render);load();</script></body></html>
