<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests"><title>Haberler — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>.news-card{border:1px solid rgba(57,255,136,.16);border-radius:12px;margin-top:10px;overflow:hidden}.news-head{padding:13px 14px}.news-title{font-size:13px;font-weight:800;line-height:1.5}.news-title a{color:var(--text);text-decoration:none}.news-title a:hover{text-decoration:underline}.news-meta{font-size:9px;color:var(--muted);margin-top:5px;line-height:1.5}.news-actions{margin-top:10px}.summary-btn{border:1px solid var(--green-dim);background:transparent;color:#39ff88;border-radius:999px;padding:6px 10px;font:inherit;font-size:9px;cursor:pointer}.news-expand{display:none;border-top:1px solid rgba(57,255,136,.12);padding:14px}.news-expand.open{display:block}.news-label{font-size:9px;color:#7eb6e6;letter-spacing:.08em;font-weight:800;margin-bottom:6px}.news-text{font-size:11px;line-height:1.75;color:var(--text)}.news-sep{height:1px;background:rgba(57,255,136,.12);margin:14px 0}.impact-pill{display:inline-block;margin-top:7px;border:1px solid var(--green-dim);border-radius:999px;padding:5px 9px;font-size:9px;font-weight:800}.impact-positive{color:#39ff88}.impact-negative{color:#ff7070;border-color:rgba(255,112,112,.4)}.impact-neutral{color:#ffcf5c;border-color:rgba(255,207,92,.4)}.context-note{font-size:8px;color:var(--muted);margin-top:8px;line-height:1.5}.agent-grid{display:grid;grid-template-columns:1fr;gap:7px}.agent-line{padding:8px 9px;border:1px solid rgba(57,255,136,.1);border-radius:8px;font-size:10px;line-height:1.6}.agent-line b{color:#39ff88}.source-card .source-value{line-height:1.6}@media(max-width:600px){.news-head,.news-expand{padding:12px}.news-title{font-size:12px}}</style><script data-security-frameguard>try{if(window.top!==window.self){window.top.location=window.self.location.href}}catch(e){document.documentElement.style.display="none"}</script></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>📰 HABERLER</h1><p>Güvenilir Kaynak · Türkçe Özet · Ajan Yorumu · Piyasa Etkisi</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
let NEWS_DATA=null;
const lang=()=>localStorage.getItem('marketLang')==='en'?'en':'tr';
const L=(tr,en)=>lang()==='tr'?tr:en;
function dt(x){return x?new Date(x).toLocaleString(lang()==='tr'?'tr-TR':'en-US'):L('Tarih yok','No date')}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function lower(x){return String(x||'').toLowerCase()}
function words(s){return new Set(lower(s).match(/[a-z0-9çğıöşü]+/g)||[])}
function repeats(a,b){const A=words(a),B=words(b);if(!A.size||!B.size)return false;let n=0;A.forEach(x=>{if(B.has(x))n++});return n/Math.max(1,Math.min(A.size,B.size))>.72}
function summaryFor(x){let s=lang()==='tr'?(x.article_summary_tr||x.article_summary||x.context):(x.article_summary_en||x.article_summary_original||x.article_summary||x.context);let full=lang()==='tr'?(x.article_context_tr||x.article_context||x.context):(x.article_context_en||x.article_context_original||x.article_context||x.context);if(!s)return L('Güvenilir özet metni üretilemedi.','A reliable summary could not be generated.');if(repeats(s,x.title||'')){const ss=String(full||'').split(/(?<=[.!?])\s+/).filter(z=>z.length>35&&!repeats(z,x.title||''));if(ss.length)s=ss.slice(0,3).join(' ');else return L('Kaynak metni başlıktan ek bilgi vermediği için özet gösterilmedi.','The source text did not add enough information beyond the headline, so no summary is shown.') }return s}
function impactFor(x){const t=lower((x.title||'')+' '+(x.article_summary_en||'')+' '+(x.article_context_en||''));let score=0;['surge','rally','rebound','inflow','easing','rate cut','yields fall','liquidity improves','record high','beats expectations','strong growth'].forEach(k=>{if(t.includes(k))score++});['selloff','plunge','slump','outflow','yields rise','inflation accelerates','higher for longer','default','recession','tariff','crackdown','liquidation','debt concern','structural concern'].forEach(k=>{if(t.includes(k))score--});if(t.includes('short squeeze'))score=Math.max(score,1);if(t.includes('buyback')&&(t.includes('relief may be brief')||t.includes('structural concern')||t.includes("won't curb")||t.includes('won’t curb')))score=-1;if(score>0)return{label:L('POZİTİF','POSITIVE'),cls:'impact-positive',score};if(score<0)return{label:L('NEGATİF','NEGATIVE'),cls:'impact-negative',score};return{label:L('NÖTR / KARIŞIK','NEUTRAL / MIXED'),cls:'impact-neutral',score:0}}
function agentView(x,topic,impact){const t=lower((x.title||'')+' '+(x.article_summary_en||'')+' '+(x.article_context_en||''));let meaning,confirm,invalidate;
if(topic==='Bitcoin'){
 if(t.includes('etf')||t.includes('inflow')||t.includes('outflow')){meaning=L('ETF akışı spot talebin kalitesini ölçmek için önemli. Tek günlük rakamdan çok 3 günlük yön ve fiyatın buna tepkisi önemli.','ETF flows are useful for judging spot demand quality. The 3-day direction and price response matter more than one day.');confirm=L('BTC Spot CVD pozitif, ETF 3-gün toplamı girişte ve OI/funding aşırı hızlanmıyorsa haber sağlıklı talep ile teyit edilir.','Confirmation: positive BTC spot CVD, positive 3-day ETF flow, and OI/funding not accelerating excessively.');invalidate=L('ETF girişine rağmen Spot CVD negatifleşir veya OI/funding hızla şişerse hareket kaldıraç kaynaklı ve kırılgan kabul edilir.','Invalidation: spot CVD turns negative despite inflows, or OI/funding expand too fast, suggesting a leverage-led fragile move.');}
 else if(t.includes('short squeeze')){meaning=L('Yükselişin bir kısmı gerçek yeni alımdan değil short kapamalarından geliyor olabilir; bu yüzden hareketin kalitesi orta.','Part of the rally may be short covering rather than fresh demand, so move quality is only moderate.');confirm=L('Spot CVD ve ETF girişleri de aynı anda güçlenirse short squeeze gerçek spot talebe dönüşmüş sayılır.','If spot CVD and ETF inflows strengthen too, the squeeze is being replaced by real spot demand.');invalidate=L('OI yeniden yükselirken Spot CVD zayıf kalırsa squeeze sonrası geri verme riski artar.','If OI rises again while spot CVD stays weak, post-squeeze reversal risk increases.');}
 else{meaning=L(`Bu haber Bitcoin açısından ${impact.label.toLowerCase()} bir katkı yapıyor; ancak tek başına yön sinyali değil.`,`This headline adds a ${impact.label.toLowerCase()} impulse for Bitcoin, but is not a standalone directional signal.`);confirm=L('Spot CVD, ETF 3-gün akışı ve fiyat aynı yönde olursa haberin etkisine güven artar.','Confidence rises if spot CVD, 3-day ETF flow and price move in the same direction.');invalidate=L('Haber yönü ile spot akış ve fiyat ayrışırsa haber etkisi düşük ağırlığa düşürülür.','If headline direction diverges from spot flows and price, the headline is down-weighted.');}}
else if(topic.includes('Makro')){
 if(t.includes('yield')||t.includes('treasury')||t.includes('buyback')){meaning=L('Asıl kanal uzun vadeli faiz ve net likidite. Kısa süreli tahvil rahatlamasını kalıcı makro gevşeme saymıyoruz.','The main channel is long-end yields and net liquidity. A temporary bond relief is not treated as durable macro easing.');confirm=L('10Y/30Y faiz geriler, 3-hafta net likidite iyileşir ve kredi spreadleri açılmazsa pozitif etki güçlenir.','Confirmation: 10Y/30Y yields fall, 3-week net liquidity improves, and credit spreads do not widen.');invalidate=L('Uzun faiz yeniden yükselir veya TGA artışı net likiditeyi çekerse haberin pozitif etkisi iptal edilir.','Invalidation: long yields rise again or TGA drains net liquidity.');}
 else if(t.includes('inflation')||t.includes('cpi')||t.includes('pce')){meaning=L('Bu veri Fed faiz patikası üzerinden risk varlıklarını etkiler. Seviye kadar beklentiye göre sürpriz önemlidir.','This data matters through the Fed path. The surprise versus expectations matters as much as the level.');confirm=L('Tahvil faizleri ve dolar veri sonrası gerilerse risk-on yorumu teyit edilir.','Confirmation: Treasury yields and the dollar fall after the release.');invalidate=L('Enflasyon iyi görünse bile 10Y/30Y yükseliyorsa piyasa farklı bir risk fiyatlıyor olabilir.','If 10Y/30Y yields rise despite benign inflation, the market may be pricing another risk.');}
 else{meaning=L('Haberi büyüme, Fed patikası, uzun faiz ve likidite kanallarından okuyoruz.','We read this through growth, Fed path, long yields and liquidity.');confirm=L('Makro barometre ve kredi spreadleri aynı yönde hareket ederse güven artar.','Confidence rises when the macro barometer and credit spreads confirm the same direction.');invalidate=L('Piyasa fiyatlaması haber anlatısıyla ayrışırsa haberin ağırlığı azaltılır.','If market pricing diverges from the narrative, the headline is down-weighted.');}}
else{meaning=L('Bu içerik bağlam sağlar; tek başına pozisyon sinyali değildir.','This item provides context; it is not a standalone position signal.');confirm=L('Fiyat, hacim ve ilgili ajan verileri aynı yönü teyit etmeli.','Price, volume and relevant agent data should confirm the same direction.');invalidate=L('Sayısal veriler tersini gösterirse görüş/haber ağırlığı düşürülür.','If quantitative data points the other way, the view/headline is down-weighted.');}
return{meaning,confirm,invalidate}}
function sourceNote(x){if(x.context_mode==='publisher_article')return L('Özet yayıncı sayfasındaki okunabilir içerikten üretildi.','Summary generated from readable publisher-page content.');if(x.context_mode==='trusted_feed_text')return L('Yayıncı sayfası okunamadı; güvenilir kaynağın kendi RSS/press metni kullanıldı.','Publisher page was unavailable; the trusted source’s own RSS/press text was used.');if(x.context_mode==='official_video_transcript')return L('Özet resmi video transcript/caption metninden üretildi.','Summary generated from the official video transcript/captions.');if(x.context_mode==='x_api_post')return L('İçerik resmi/public X hesabının API gönderisinden alındı.','Content taken from the official/public X account via API.');return L('Özet güvenilir kaynak metninden üretildi.','Summary generated from trusted source text.')}
function itemHtml(x,topic,i){const summary=summaryFor(x),impact=impactFor(x),v=agentView(x,topic,impact),id=`n-${topic.replace(/\W/g,'')}-${i}`;return `<div class="news-card"><div class="news-head"><div class="news-title"><a href="${esc(x.link||x.resolved_url||'#')}" target="_blank" rel="noopener">${esc(x.title)}</a></div><div class="news-meta">${esc(x.source||L('Kaynak belirtilmedi','Source unavailable'))} · ${dt(x.published_at)} · ${x.trusted?L('güvenilir kaynak','trusted source'):L('kaynak durumu belirsiz','source status unclear')}</div><div class="news-actions"><button class="summary-btn" onclick="toggleNews('${id}',this)">${L('Özet + Yorum','Summary + View')}</button></div></div><div id="${id}" class="news-expand"><div class="news-label">${L('HABER ÖZETİ','NEWS SUMMARY')}</div><div class="news-text">${esc(summary)}</div><div class="context-note">${esc(sourceNote(x))}</div><div class="news-sep"></div><div class="news-label">${L('AJAN YORUMU','AGENT VIEW')}</div><div class="agent-grid"><div class="agent-line"><b>${L('Ne anlama geliyor:','Meaning:')}</b> ${esc(v.meaning)}</div><div class="agent-line"><b>${L('Teyit için:','Confirmation:')}</b> ${esc(v.confirm)}</div><div class="agent-line"><b>${L('Görüşü bozan sinyal:','Invalidation:')}</b> ${esc(v.invalidate)}</div></div><div class="news-sep"></div><div class="news-label">${L('PİYASAYA ETKİSİ','MARKET IMPACT')}</div><span class="impact-pill ${impact.cls}">${impact.label}</span></div></div>`}
function toggleNews(id,btn){const el=document.getElementById(id);if(!el)return;const open=el.classList.toggle('open');btn.textContent=open?L('Kapat','Close'):L('Özet + Yorum','Summary + View')}
function src(d){const p=d?.source_policy||{};return `<div class="card source-card"><h2>${L('Veri Kaynakları ve Okuma Politikası','Sources & Reading Policy')}</h2><div class="source-list"><div class="source-item"><div class="source-label">Bitcoin</div><div class="source-value">${esc((p.Bitcoin||['CoinDesk','Reuters','CNBC','Yahoo Finance','Bloomberg']).join(' · '))}</div></div><div class="source-item"><div class="source-label">${L('Makro','Macro')}</div><div class="source-value">${esc((p.Makro||['Federal Reserve','U.S. Treasury','BLS','BEA','Reuters','CNBC','Yahoo Finance','Bloomberg']).join(' · '))}</div></div><div class="source-item"><div class="source-label">${L('Özet standardı','Summary standard')}</div><div class="source-value">${L('Başlığı tekrar eden cümleler özetten atılır. Önce yayıncı sayfası okunur; açılmazsa yalnız güvenilir kaynağın kendi RSS/press açıklaması kullanılır.','Headline-like sentences are excluded. Publisher-page content is preferred; otherwise only the trusted source’s own RSS/press text is used.')}</div></div></div></div>`}
function render(d){NEWS_DATA=d;updated.textContent=L('Güncelleme: ','Updated: ')+new Date(d.generated_at).toLocaleString(lang()==='tr'?'tr-TR':'en-US');content.innerHTML=(d.topics||[]).map(t=>`<div class="card"><h2>${esc(t.label)}</h2>${(t.items||[]).length?t.items.map((x,i)=>itemHtml(x,t.label,i)).join(''):`<div class="empty">${L(`Son ${d.recency_hours||96} saatte uygun haber bulunamadı.`,`No eligible news found in the last ${d.recency_hours||96} hours.`)}</div>`}</div>`).join('')+`<div class="note">${L('Haber özeti ile ajan yorumu ayrı katmanlardır; ajan yorumu yalnız karar açısından neyin teyit edilmesi gerektiğini söyler.','News summary and agent view are separate layers; the agent view focuses on what must confirm or invalidate the market interpretation.')}</div>`+src(d)}
async function load(){try{render(await(await fetch('../data/news.json?t='+Date.now())).json())}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${esc(e.message)}</div>`}}
window.addEventListener('market-language-changed',()=>{if(NEWS_DATA)render(NEWS_DATA)});load()</script></body></html>
