<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests"><title>Haberler — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>.news-card{border:1px solid rgba(57,255,136,.16);border-radius:12px;margin-top:10px;overflow:hidden}.news-head{padding:13px 14px}.news-title{font-size:13px;font-weight:800;line-height:1.5}.news-title a{color:var(--text);text-decoration:none}.news-title a:hover{text-decoration:underline}.news-meta{font-size:9px;color:var(--muted);margin-top:5px;line-height:1.5}.news-actions{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}.summary-btn,.source-btn{border:1px solid var(--green-dim);background:transparent;color:#39ff88;border-radius:999px;padding:6px 10px;font:inherit;font-size:9px;cursor:pointer;text-decoration:none}.source-btn{color:#7eb6e6;border-color:rgba(126,182,230,.35)}.news-expand{display:none;border-top:1px solid rgba(57,255,136,.12);padding:14px}.news-expand.open{display:block}.news-label{font-size:9px;color:#7eb6e6;letter-spacing:.08em;font-weight:800;margin-bottom:6px}.news-text{font-size:11px;line-height:1.75;color:var(--text)}.news-sep{height:1px;background:rgba(57,255,136,.12);margin:14px 0}.impact-pill,.quality-pill,.scope-pill{display:inline-block;border:1px solid var(--green-dim);border-radius:999px;padding:5px 9px;font-size:9px;font-weight:800}.impact-positive{color:#39ff88}.impact-negative{color:#ff7070;border-color:rgba(255,112,112,.4)}.impact-neutral{color:#ffcf5c;border-color:rgba(255,207,92,.4)}.quality-full{color:#39ff88}.quality-source{color:#ffcf5c;border-color:rgba(255,207,92,.4)}.quality-headline{color:#7eb6e6;border-color:rgba(126,182,230,.35)}.scope-pill{color:#9fc6e8;border-color:rgba(126,182,230,.28)}.context-note{font-size:8px;color:var(--muted);margin-top:8px;line-height:1.5}.agent-grid{display:grid;grid-template-columns:1fr;gap:7px}.agent-line{padding:8px 9px;border:1px solid rgba(57,255,136,.1);border-radius:8px;font-size:10px;line-height:1.6}.agent-line b{color:#39ff88}.headline-note{margin-top:9px;padding:9px;border:1px dashed rgba(126,182,230,.3);border-radius:8px;color:#8eafc8;font-size:9px;line-height:1.6}@media(max-width:600px){.news-head,.news-expand{padding:12px}.news-title{font-size:12px}}</style><script data-security-frameguard>try{if(window.top!==window.self){window.top.location=window.self.location.href}}catch(e){document.documentElement.style.display="none"}</script></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>📰 HABERLER</h1><p>Güvenilir Kaynak · Türkçe Özet · Ajan Yorumu · Piyasa Etkisi</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
let NEWS_DATA=null;const lang=()=>localStorage.getItem('marketLang')==='en'?'en':'tr';const L=(tr,en)=>lang()==='tr'?tr:en;
function dt(x){return x?new Date(x).toLocaleString(lang()==='tr'?'tr-TR':'en-US'):L('Tarih yok','No date')}function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function lower(x){return String(x||'').toLowerCase()}function titleFor(x){return lang()==='tr'?(x.title_tr||x.title):(x.title||x.title_tr)}function summaryFor(x){if(!x.summary_available)return null;if(lang()==='tr')return x.article_summary_tr||null;return x.article_summary_en||x.article_summary||null}
function qualityFor(x){if(x.read_status==='full_article_read')return{label:L('TAM HABER OKUNDU','FULL ARTICLE READ'),cls:'quality-full'};if(x.summary_available)return{label:L('KAYNAK METNİ','SOURCE TEXT'),cls:'quality-source'};return{label:L('SADECE BAŞLIK','HEADLINE ONLY'),cls:'quality-headline'}}
function storyText(x){return lower((x.title||'')+' '+(x.article_summary_en||'')+' '+(x.article_context_en||''))}
function assetScope(x,topic){const t=storyText(x);if(/\bbitcoin\b|\bbtc\b/.test(t))return{key:'bitcoin',label:'BTC'};if(/\bmonad\b/.test(t))return{key:'monad',label:'MONAD'};if(/\bsolana\b|\bsol\b/.test(t))return{key:'solana',label:'SOLANA'};if(/\bethereum\b|\bether\b|\beth\b/.test(t))return{key:'ethereum',label:'ETHEREUM'};if(/\bxrp\b|\bripple\b/.test(t))return{key:'xrp',label:'XRP'};if(/\bcrypto\b|blockchain|wallet|token|defi|protocol|quantum/.test(t))return{key:'crypto',label:L('KRİPTO / PROTOKOL','CRYPTO / PROTOCOL')};if(String(topic||'').includes('Makro'))return{key:'macro',label:L('MAKRO','MACRO')};return{key:'general',label:L('GENEL PİYASA','GENERAL MARKET')}}
function impactFor(x){if(!x.summary_available)return null;const t=storyText(x);let score=0;['surge','rally','rebound','inflow','easing','rate cut','record high','upgrade','adoption','approval','secure','security improvement'].forEach(k=>{if(t.includes(k))score++});['selloff','plunge','slump','outflow','default','recession','tariff','crackdown','liquidation','hack','exploit','attack'].forEach(k=>{if(t.includes(k))score--});if(score>0)return{label:L('POZİTİF','POSITIVE'),cls:'impact-positive'};if(score<0)return{label:L('NEGATİF','NEGATIVE'),cls:'impact-negative'};return{label:L('NÖTR / KARIŞIK','NEUTRAL / MIXED'),cls:'impact-neutral'}}
function agentView(x,topic,impact){const t=storyText(x),s=assetScope(x,topic);if(s.key==='bitcoin'){if(t.includes('etf')||t.includes('inflow')||t.includes('outflow'))return{meaning:L('Bu haber doğrudan Bitcoin/spot talep tarafıyla ilgili. ETF akışının birkaç günlük yönü ve fiyat tepkisi tek günlük rakamdan daha önemli.','This story directly concerns Bitcoin/spot demand. Multi-day ETF direction and price response matter more than one day.'),confirm:L('BTC fiyatı, spot CVD, ETF akışı ve türev verileri aynı yönde teyit etmeli.','BTC price, spot CVD, ETF flow and derivatives should confirm.'),invalidate:L('Spot akış veya fiyat haber anlatısıyla ayrışırsa haberin BTC ağırlığı düşürülür.','If spot flow or price diverges from the story, down-weight it for BTC.')};return{meaning:L(`Bu haber doğrudan Bitcoin ile ilgili ve şu aşamada ${impact.label.toLowerCase()} bir bağlam yaratıyor; tek başına işlem sinyali değil.`,`This story directly concerns Bitcoin and currently creates a ${impact.label.toLowerCase()} context; it is not a standalone trade signal.`),confirm:L('BTC fiyatı, spot CVD, OI/funding ve yapı aynı yönde teyit etmeli.','BTC price, spot CVD, OI/funding and structure should confirm.'),invalidate:L('BTC akışı ve fiyat tepkisi haberle uyuşmazsa haber etkisi düşürülür.','If BTC flow and price response disagree, down-weight the story.')}}
if(['monad','solana','ethereum','xrp','crypto'].includes(s.key)){const name=s.label;return{meaning:L(`Bu haber ${name} / ilgili ekosistemle doğrudan ilgili. Bitcoin için doğrudan yön sinyali değildir; BTC'ye ancak geniş kripto risk iştahı veya sistemik etki üzerinden dolaylı yansıyabilir.`,`This story directly concerns ${name} / its ecosystem. It is not a direct Bitcoin directional signal; BTC impact is only indirect through broad crypto risk appetite or systemic effects.`),confirm:L(`${name} fiyatı, hacim, ağ/ekosistem aktivitesi ve varsa spot/türev akışları haberi teyit etmeli.`,`${name} price, volume, network/ecosystem activity and spot/derivatives flows should confirm the story.`),invalidate:L(`Haber olumlu/olumsuz görünürken ${name} fiyatı ve kullanım verileri ters yönde kalırsa haber etkisi düşük ağırlığa alınır.`,`If ${name} price and usage data move against the story, down-weight its impact.`)}}
if(s.key==='macro')return{meaning:L('Bu haber makro piyasa bağlamıyla ilgili; büyüme, Fed patikası, uzun faiz ve likidite kanallarından okunmalı.','This is a macro story; read it through growth, the Fed path, long yields and liquidity.'),confirm:L('Tahvil faizleri, dolar ve kredi spreadleri aynı yönde teyit verirse güven artar.','Confidence rises when yields, dollar and credit spreads confirm.'),invalidate:L('Piyasa fiyatlaması haber anlatısıyla ayrışırsa haberin ağırlığı azaltılır.','If market pricing diverges, down-weight the news.')};return{meaning:L('Bu içerik genel piyasa bağlamı sağlar; Bitcoin veya başka bir varlık için otomatik yön sinyali değildir.','This provides general market context and is not an automatic directional signal for Bitcoin or any other asset.'),confirm:L('İlgili varlığın fiyatı, hacmi ve temel/akış verileri aynı yönde teyit etmeli.','The relevant asset price, volume and fundamental/flow data should confirm.'),invalidate:L('İlgili sayısal veriler tersini gösterirse haber ağırlığı düşürülür.','If relevant quantitative data points the other way, down-weight it.')}}
function sourceNote(x){if(x.read_status==='full_article_read')return L('Yayıncı sayfasındaki gerçek haber gövdesi okunarak 3–4 cümlelik özet üretildi.','Summary was generated from the readable publisher article body.');if(x.summary_available)return L('Tam yayıncı sayfası okunamadı; güvenilir kaynağın yeterli kendi metni kullanıldı.','Publisher page was unavailable; substantial trusted source text was used.');return L('Haber güvenilir kaynakta bulundu ancak yeterli gövde metni okunamadı. Bu nedenle özet, ajan yorumu ve piyasa yönü üretilmedi.','The trusted headline was discovered, but enough body text could not be read. No summary, agent view or market direction was generated.')}
function itemHtml(x,topic,i){const id=`n-${topic.replace(/\W/g,'')}-${i}`,url=x.link||x.resolved_url||'#',q=qualityFor(x),summary=summaryFor(x),scope=assetScope(x,topic);if(!x.summary_available||!summary){return `<div class="news-card"><div class="news-head"><div class="news-title"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(titleFor(x))}</a></div><div class="news-meta">${esc(x.source||L('Kaynak belirtilmedi','Source unavailable'))} · ${dt(x.published_at)} · ${L('güvenilir kaynak','trusted source')}</div><div class="news-actions"><span class="quality-pill ${q.cls}">${q.label}</span><span class="scope-pill">${esc(scope.label)}</span><a class="source-btn" href="${esc(url)}" target="_blank" rel="noopener">${L('Kaynağı Aç','Open Source')}</a></div><div class="headline-note">${esc(sourceNote(x))}</div></div></div>`}const impact=impactFor(x),v=agentView(x,topic,impact);return `<div class="news-card"><div class="news-head"><div class="news-title"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(titleFor(x))}</a></div><div class="news-meta">${esc(x.source||L('Kaynak belirtilmedi','Source unavailable'))} · ${dt(x.published_at)} · ${L('güvenilir kaynak','trusted source')}</div><div class="news-actions"><span class="quality-pill ${q.cls}">${q.label}</span><span class="scope-pill">${esc(scope.label)}</span><button class="summary-btn" onclick="toggleNews('${id}',this)">${L('Özet + Yorum','Summary + View')}</button><a class="source-btn" href="${esc(url)}" target="_blank" rel="noopener">${L('Kaynak','Source')}</a></div></div><div id="${id}" class="news-expand"><div class="news-label">${L('HABER ÖZETİ','NEWS SUMMARY')}</div><div class="news-text">${esc(summary)}</div><div class="context-note">${esc(sourceNote(x))}</div><div class="news-sep"></div><div class="news-label">${L('AJAN YORUMU','AGENT VIEW')}</div><div class="agent-grid"><div class="agent-line"><b>${L('Ne anlama geliyor:','Meaning:')}</b> ${esc(v.meaning)}</div><div class="agent-line"><b>${L('Teyit için:','Confirmation:')}</b> ${esc(v.confirm)}</div><div class="agent-line"><b>${L('Görüşü bozan sinyal:','Invalidation:')}</b> ${esc(v.invalidate)}</div></div><div class="news-sep"></div><div class="news-label">${scope.key==='bitcoin'?L('BTC ETKİSİ','BTC IMPACT'):L('İLGİLİ VARLIĞA / PİYASAYA ETKİSİ','RELEVANT ASSET / MARKET IMPACT')}</div><span class="impact-pill ${impact.cls}">${impact.label}</span></div></div>`}
function toggleNews(id,btn){const el=document.getElementById(id);if(!el)return;const open=el.classList.toggle('open');btn.textContent=open?L('Kapat','Close'):L('Özet + Yorum','Summary + View')}
function render(d){NEWS_DATA=d;updated.textContent=L('Güncelleme: ','Updated: ')+new Date(d.generated_at).toLocaleString(lang()==='tr'?'tr-TR':'en-US');const stats=`<div class="note">${L(`Bulunan haber: ${d.headline_count||0} · Derin özet: ${d.summary_available_count||0} · Sadece başlık: ${d.headline_only_count||0}`,`Discovered: ${d.headline_count||0} · Deep summaries: ${d.summary_available_count||0} · Headline only: ${d.headline_only_count||0}`)}</div>`;content.innerHTML=stats+(d.topics||[]).map(t=>`<div class="card"><h2>${esc(t.label)}</h2>${(t.items||[]).length?t.items.map((x,i)=>itemHtml(x,t.label,i)).join(''):`<div class="empty">${L(`Son ${d.recency_hours||96} saatte uygun haber bulunamadı.`,`No eligible news found in the last ${d.recency_hours||96} hours.`)}</div>`}</div>`).join('')}
async function load(){try{render(await(await fetch('../data/news.json?t='+Date.now(),{cache:'no-store'})).json())}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${esc(e.message)}</div>`}}window.addEventListener('market-language-changed',()=>{if(NEWS_DATA)render(NEWS_DATA)});load()</script></body></html>
