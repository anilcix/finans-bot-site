<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests"><title>Haberler — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>.news-card{border:1px solid rgba(57,255,136,.16);border-radius:12px;margin-top:10px;overflow:hidden}.news-head{padding:13px 14px}.news-title{font-size:13px;font-weight:800;line-height:1.5}.news-title a{color:var(--text);text-decoration:none}.news-title a:hover{text-decoration:underline}.news-meta{font-size:9px;color:var(--muted);margin-top:5px;line-height:1.5}.news-actions{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}.summary-btn,.source-btn{border:1px solid var(--green-dim);background:transparent;color:#39ff88;border-radius:999px;padding:6px 10px;font:inherit;font-size:9px;cursor:pointer;text-decoration:none}.source-btn{color:#7eb6e6;border-color:rgba(126,182,230,.35)}.news-expand{display:none;border-top:1px solid rgba(57,255,136,.12);padding:14px}.news-expand.open{display:block}.news-label{font-size:9px;color:#7eb6e6;letter-spacing:.08em;font-weight:800;margin-bottom:6px}.news-text{font-size:11px;line-height:1.75;color:var(--text)}.news-sep{height:1px;background:rgba(57,255,136,.12);margin:14px 0}.impact-pill,.quality-pill{display:inline-block;border:1px solid var(--green-dim);border-radius:999px;padding:5px 9px;font-size:9px;font-weight:800}.impact-positive{color:#39ff88}.impact-negative{color:#ff7070;border-color:rgba(255,112,112,.4)}.impact-neutral{color:#ffcf5c;border-color:rgba(255,207,92,.4)}.quality-full{color:#39ff88}.quality-source{color:#ffcf5c;border-color:rgba(255,207,92,.4)}.quality-headline{color:#7eb6e6;border-color:rgba(126,182,230,.35)}.context-note{font-size:8px;color:var(--muted);margin-top:8px;line-height:1.5}.agent-grid{display:grid;grid-template-columns:1fr;gap:7px}.agent-line{padding:8px 9px;border:1px solid rgba(57,255,136,.1);border-radius:8px;font-size:10px;line-height:1.6}.agent-line b{color:#39ff88}.headline-note{margin-top:9px;padding:9px;border:1px dashed rgba(126,182,230,.3);border-radius:8px;color:#8eafc8;font-size:9px;line-height:1.6}.source-card .source-value{line-height:1.6}@media(max-width:600px){.news-head,.news-expand{padding:12px}.news-title{font-size:12px}}</style><script data-security-frameguard>try{if(window.top!==window.self){window.top.location=window.self.location.href}}catch(e){document.documentElement.style.display="none"}</script></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>📰 HABERLER</h1><p>Güvenilir Kaynak · Türkçe Özet · Ajan Yorumu · Piyasa Etkisi</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
let NEWS_DATA=null;const lang=()=>localStorage.getItem('marketLang')==='en'?'en':'tr';const L=(tr,en)=>lang()==='tr'?tr:en;
function dt(x){return x?new Date(x).toLocaleString(lang()==='tr'?'tr-TR':'en-US'):L('Tarih yok','No date')}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function lower(x){return String(x||'').toLowerCase()}
function titleFor(x){return lang()==='tr'?(x.title_tr||x.title):(x.title||x.title_tr)}
function summaryFor(x){if(!x.summary_available)return null;if(lang()==='tr')return x.article_summary_tr||null;return x.article_summary_en||x.article_summary||null}
function qualityFor(x){if(x.read_status==='full_article_read')return{label:L('TAM HABER OKUNDU','FULL ARTICLE READ'),cls:'quality-full'};if(x.summary_available)return{label:L('KAYNAK METNİ','SOURCE TEXT'),cls:'quality-source'};return{label:L('SADECE BAŞLIK','HEADLINE ONLY'),cls:'quality-headline'}}
function impactFor(x){if(!x.summary_available)return null;const t=lower((x.article_summary_en||'')+' '+(x.article_context_en||''));let score=0;['surge','rally','rebound','inflow','easing','rate cut','yields fall','record high','beats expectations','strong growth'].forEach(k=>{if(t.includes(k))score++});['selloff','plunge','slump','outflow','yields rise','inflation accelerates','higher for longer','default','recession','tariff','crackdown','liquidation'].forEach(k=>{if(t.includes(k))score--});if(score>0)return{label:L('POZİTİF','POSITIVE'),cls:'impact-positive'};if(score<0)return{label:L('NEGATİF','NEGATIVE'),cls:'impact-negative'};return{label:L('NÖTR / KARIŞIK','NEUTRAL / MIXED'),cls:'impact-neutral'}}
function agentView(x,topic,impact){const t=lower((x.article_summary_en||'')+' '+(x.article_context_en||''));if(topic==='Bitcoin'){if(t.includes('etf')||t.includes('inflow')||t.includes('outflow'))return{meaning:L('ETF akışı spot talebin kalitesini ölçmek için önemli. Tek günlük rakamdan çok birkaç günlük yön ve fiyat tepkisi önemli.','ETF flows help measure spot-demand quality; multi-day direction and price response matter more than one day.'),confirm:L('Spot CVD, ETF akışı ve fiyat aynı yöndeyse haber etkisine güven artar.','Confidence rises when spot CVD, ETF flow and price agree.'),invalidate:L('Spot akış haber anlatısıyla ayrışırsa haberin ağırlığı düşürülür.','If spot flow diverges from the story, down-weight it.')};return{meaning:L(`Bu haber Bitcoin açısından ${impact.label.toLowerCase()} bir katkı yapıyor; ancak tek başına yön sinyali değil.`,`This news adds a ${impact.label.toLowerCase()} impulse for Bitcoin but is not a standalone signal.`),confirm:L('Fiyat, spot CVD ve ilgili türev verileri aynı yönde teyit etmeli.','Price, spot CVD and derivatives should confirm the same direction.'),invalidate:L('Haber yönü ile gerçek akış ayrışırsa haber etkisi düşük ağırlığa düşürülür.','If the story diverges from actual flow, down-weight it.')}}if(topic.includes('Makro'))return{meaning:L('Haberi büyüme, Fed patikası, uzun faiz ve likidite kanallarından okuyoruz.','Read through growth, the Fed path, long yields and liquidity.'),confirm:L('Tahvil faizleri, dolar ve kredi spreadleri aynı yönde teyit verirse güven artar.','Confidence rises when yields, dollar and credit spreads confirm.'),invalidate:L('Piyasa fiyatlaması haber anlatısıyla ayrışırsa haberin ağırlığı azaltılır.','If market pricing diverges, down-weight the news.')};return{meaning:L('Bu içerik bağlam sağlar; tek başına pozisyon sinyali değildir.','This provides context, not a standalone position signal.'),confirm:L('Fiyat, hacim ve ilgili ajan verileri aynı yönü teyit etmeli.','Price, volume and agent data should confirm.'),invalidate:L('Sayısal veriler tersini gösterirse haber ağırlığı düşürülür.','If quantitative data points the other way, down-weight it.')}}
function sourceNote(x){if(x.read_status==='full_article_read')return L('Yayıncı sayfasındaki gerçek haber gövdesi okunarak 3–4 cümlelik özet üretildi.','Summary was generated from the readable publisher article body.');if(x.summary_available)return L('Tam yayıncı sayfası okunamadı; güvenilir kaynağın yeterli kendi metni kullanıldı.','Publisher page was unavailable; substantial trusted source text was used.');return L('Haber güvenilir kaynakta bulundu ancak otomatik sistem yeterli gövde metni okuyamadı. Bu nedenle özet ve piyasa yönü uydurulmadı.','The trusted headline was discovered, but enough body text could not be read. No summary or market direction was invented.')}
function itemHtml(x,topic,i){const id=`n-${topic.replace(/\W/g,'')}-${i}`,url=x.link||x.resolved_url||'#',q=qualityFor(x),summary=summaryFor(x);if(!x.summary_available||!summary){return `<div class="news-card"><div class="news-head"><div class="news-title"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(titleFor(x))}</a></div><div class="news-meta">${esc(x.source||L('Kaynak belirtilmedi','Source unavailable'))} · ${dt(x.published_at)} · ${L('güvenilir kaynak','trusted source')}</div><div class="news-actions"><span class="quality-pill ${q.cls}">${q.label}</span><a class="source-btn" href="${esc(url)}" target="_blank" rel="noopener">${L('Kaynağı Aç','Open Source')}</a></div><div class="headline-note">${esc(sourceNote(x))}</div></div></div>`}const impact=impactFor(x),v=agentView(x,topic,impact);return `<div class="news-card"><div class="news-head"><div class="news-title"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(titleFor(x))}</a></div><div class="news-meta">${esc(x.source||L('Kaynak belirtilmedi','Source unavailable'))} · ${dt(x.published_at)} · ${L('güvenilir kaynak','trusted source')}</div><div class="news-actions"><span class="quality-pill ${q.cls}">${q.label}</span><button class="summary-btn" onclick="toggleNews('${id}',this)">${L('Özet + Yorum','Summary + View')}</button><a class="source-btn" href="${esc(url)}" target="_blank" rel="noopener">${L('Kaynak','Source')}</a></div></div><div id="${id}" class="news-expand"><div class="news-label">${L('HABER ÖZETİ','NEWS SUMMARY')}</div><div class="news-text">${esc(summary)}</div><div class="context-note">${esc(sourceNote(x))}</div><div class="news-sep"></div><div class="news-label">${L('AJAN YORUMU','AGENT VIEW')}</div><div class="agent-grid"><div class="agent-line"><b>${L('Ne anlama geliyor:','Meaning:')}</b> ${esc(v.meaning)}</div><div class="agent-line"><b>${L('Teyit için:','Confirmation:')}</b> ${esc(v.confirm)}</div><div class="agent-line"><b>${L('Görüşü bozan sinyal:','Invalidation:')}</b> ${esc(v.invalidate)}</div></div><div class="news-sep"></div><div class="news-label">${L('PİYASAYA ETKİSİ','MARKET IMPACT')}</div><span class="impact-pill ${impact.cls}">${impact.label}</span></div></div>`}
function toggleNews(id,btn){const el=document.getElementById(id);if(!el)return;const open=el.classList.toggle('open');btn.textContent=open?L('Kapat','Close'):L('Özet + Yorum','Summary + View')}
function render(d){NEWS_DATA=d;updated.textContent=L('Güncelleme: ','Updated: ')+new Date(d.generated_at).toLocaleString(lang()==='tr'?'tr-TR':'en-US');const stats=`<div class="note">${L(`Bulunan haber: ${d.headline_count||0} · Derin özet: ${d.summary_available_count||0} · Sadece başlık: ${d.headline_only_count||0}`,`Discovered: ${d.headline_count||0} · Deep summaries: ${d.summary_available_count||0} · Headline only: ${d.headline_only_count||0}`)}</div>`;content.innerHTML=stats+(d.topics||[]).map(t=>`<div class="card"><h2>${esc(t.label)}</h2>${(t.items||[]).length?t.items.map((x,i)=>itemHtml(x,t.label,i)).join(''):`<div class="empty">${L(`Son ${d.recency_hours||96} saatte uygun haber bulunamadı.`,`No eligible news found in the last ${d.recency_hours||96} hours.`)}</div>`}</div>`).join('')}
async function load(){try{render(await(await fetch('../data/news.json?t='+Date.now())).json())}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${esc(e.message)}</div>`}}
window.addEventListener('market-language-changed',()=>{if(NEWS_DATA)render(NEWS_DATA)});load()</script></body></html>
