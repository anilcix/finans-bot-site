<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests"><title>Opsiyon — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>.btc-options{border-left:3px solid #f3ba2f}.btc-note{font-size:9px;color:var(--muted);line-height:1.65;margin-top:10px}.gamma-positive{color:#39ff88}.gamma-negative{color:#ff5c5c}</style><script data-security-frameguard>try{if(window.top!==window.self){window.top.location=window.self.location.href}}catch(e){document.documentElement.style.display="none"}</script></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>📊 OPSİYON</h1><p>VIX · Vade Yapısı · BTC Max Pain · GEX · IV Rank · Put/Call</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
const H={vix9d:'Piyasanın yaklaşık önümüzdeki 9 günlük beklenen oynaklığını ölçer. Kısa vadeli korku ve olay riskine daha hassastır.',vix:'S&P 500 opsiyonlarından türetilen yaklaşık 30 günlük beklenen volatilite endeksi. Piyasa korku göstergesi olarak izlenir.',vix3m:'Yaklaşık 3 aylık beklenen volatiliteyi ölçer. Kısa vadeli VIX ile karşılaştırılarak vade yapısı okunur.'};
function b(k,l,d){let o=d[k];return `<div class="stat-box"><div class="label">${l} ${tip(H[k])}</div><div class="value">${o?o.price.toFixed(2):'—'}</div><div class="${o&&o.change_pct>=0?'negative':'positive'}">${o&&o.change_pct!=null?(o.change_pct>=0?'+':'')+o.change_pct.toFixed(2)+'%':''}</div></div>`}
function stat(l,v,n='',h=''){return `<div class="stat-box"><div class="label">${l} ${h?tip(h):''}</div><div class="value">${v}</div>${n?`<div class="note">${n}</div>`:''}</div>`}
function money(x){if(x==null)return'—';let a=Math.abs(Number(x));return '$'+(a>=1e9?(a/1e9).toFixed(2)+'B':a>=1e6?(a/1e6).toFixed(1)+'M':a>=1e3?(a/1e3).toFixed(1)+'K':a.toFixed(0))}
function src(){return `<div class="card source-card"><h2>Veri Kaynakları</h2><div class="source-list"><div class="source-item"><div class="source-label">VIX ailesi</div><div class="source-value">Yahoo Finance: ^VIX, ^VIX9D ve ^VIX3M fiyat serileri.</div></div><div class="source-item"><div class="source-label">BTC Opsiyon</div><div class="source-value">Deribit public opsiyon zinciri: Max Pain, Put/Call OI, IV ve zincirden kendi GEX hesabımız.</div></div><div class="source-item"><div class="source-label">Vade yapısı</div><div class="source-value">VIX, VIX9D ve VIX3M seviyelerinden Python tarafında contango/backwardation yorumu üretilir.</div></div><div class="source-item"><div class="source-label">SPX veri sınırı</div><div class="source-value">SPX GEX, Zero Gamma, Call/Put Wall ve dealer Greek verileri için güvenilir ücretsiz canlı opsiyon zinciri kullanılmıyor.</div></div></div></div>`}
function btcOptions(d){if(!d)return `<div class="card btc-options"><h2>₿ BTC Opsiyon</h2><div class="note">BTC opsiyon verisi alınamadı.</div></div>`;let mp=d.max_pain||{},g=d.gex_musd,iv=d.iv_rank_pct,cur=d.current_iv;let gamma=g==null?'—':`${g>=0?'+':'-'}$${Math.abs(g).toFixed(2)}M`;return `<div class="card btc-options"><h2>₿ BTC Opsiyon · Deribit</h2><div class="stat-grid">${stat('Max Pain',mp.strike!=null?'$'+Number(mp.strike).toLocaleString():'—',mp.expiry?new Date(mp.expiry).toLocaleDateString('tr-TR'):'','Açık opsiyon pozisyonlarının teorik olarak en fazla toplam kaybı ürettiği strike. Tek başına fiyat hedefi değildir.')}${stat('Put/Call OI',mp.put_call_ratio!=null?Number(mp.put_call_ratio).toFixed(2):'—','','Put açık pozisyonunun Call açık pozisyonuna oranı.')}${stat('IV Rank',iv!=null?Number(iv).toFixed(1)+'%':'—',cur!=null?'Mevcut IV '+Number(cur).toFixed(1)+'%':'','Mevcut implied volatility seviyesinin tarihsel dağılımdaki yüzdeliği.')}${stat('Net GEX',gamma,g==null?'':(g>=0?'Pozitif gamma':'Negatif gamma'),'Deribit zincirindeki strike, OI, IV ve Black-Scholes gamma üzerinden tahmini net gamma exposure.')}</div><div class="btc-note">Max Pain ve GEX mekanik referanslardır; fiyat hedefi değildir. Pozitif gamma çoğu zaman hareketi bastırıcı, negatif gamma ise hareketi büyütücü bir ortamla ilişkilendirilebilir; yön teyidi için spot/CVD/OI/funding ile birlikte okunmalıdır.</div></div>`}
async function load(){try{let [o,cd]=await Promise.all([fetch('../data/options.json?t='+Date.now()).then(r=>r.json()),fetch('../data/crypto_derivatives.json?t='+Date.now()).then(r=>r.json())]);updated.textContent='Güncelleme: '+new Date(Math.max(new Date(o.generated_at||0),new Date(cd.generated_at||0))).toLocaleString('tr-TR');content.innerHTML=btcOptions(cd)+`<div class="card"><h2>Volatilite Eğrisi ${tip('Farklı vadelerdeki beklenen volatilite seviyelerini karşılaştırır. Normal piyasada uzun vade genellikle kısa vadeden daha yüksektir.')}</h2><div class="stat-grid">${b('vix9d','VIX9D',o)}${b('vix','VIX',o)}${b('vix3m','VIX3M',o)}</div><div class="badge" style="margin-top:16px">${o.term_structure||'Vade yapısı hesaplanamadı'} ${tip('Contango: uzun vadeli volatilite kısa vadeden yüksek; normal yapı. Backwardation: kısa vadeli volatilite daha yüksek; stres işareti olabilir.')}</div></div><div class="card"><h2>SPX Veri Sınırı ${tip('Bu bölüm hangi opsiyon verilerinin ücretsiz ve güvenilir biçimde alınamadığını açıkça gösterir.')}</h2><div class="note">SPX GEX, Zero Gamma, Call/Put Wall ve dealer Greek verileri güvenilir ücretsiz canlı opsiyon zinciri olmadan hesaplanmıyor. BTC tarafındaki Deribit Max Pain/GEX/IV verileri ise yukarıdaki kartta aktiftir.</div></div>`+src()}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+src()}}load()</script></body></html>
