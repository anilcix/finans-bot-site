<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests"><title>Opsiyon — Piyasa İstihbarat Ağı</title><link rel="stylesheet" href="../style.css"><style>.btc-options{border-left:3px solid #f3ba2f}.btc-note{font-size:9px;color:var(--muted);line-height:1.65;margin-top:10px}.gamma-positive{color:#39ff88}.gamma-negative{color:#ff5c5c}.rows{display:grid;gap:7px;margin-top:10px}.rowx{display:grid;grid-template-columns:1fr auto auto auto;gap:9px;align-items:center;padding:8px 9px;border:1px solid rgba(126,182,230,.13);border-radius:8px;font-size:9px}.rowx b{color:#e8eef2}.small{color:var(--muted);font-size:8px}.warn{border-color:rgba(255,207,92,.28);color:#ffcf5c}</style><script data-security-frameguard>try{if(window.top!==window.self){window.top.location=window.self.location.href}}catch(e){document.documentElement.style.display="none"}</script></head><body><div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div><div class="page-header"><h1>📊 OPSİYON</h1><p>VIX · Vade Yapısı · BTC Max Pain · GEX · Zero Gamma · Call/Put Wall · IV Rank</p></div><div class="container" id="content"></div><script src="../help.js"></script><script>
const H={vix9d:'Piyasanın yaklaşık önümüzdeki 9 günlük beklenen oynaklığını ölçer. Kısa vadeli korku ve olay riskine daha hassastır.',vix:'S&P 500 opsiyonlarından türetilen yaklaşık 30 günlük beklenen volatilite endeksi. Piyasa korku göstergesi olarak izlenir.',vix3m:'Yaklaşık 3 aylık beklenen volatiliteyi ölçer. Kısa vadeli VIX ile karşılaştırılarak vade yapısı okunur.'};
function b(k,l,d){let o=d[k];return `<div class="stat-box"><div class="label">${l} ${tip(H[k])}</div><div class="value">${o?o.price.toFixed(2):'—'}</div><div class="${o&&o.change_pct>=0?'negative':'positive'}">${o&&o.change_pct!=null?(o.change_pct>=0?'+':'')+o.change_pct.toFixed(2)+'%':''}</div></div>`}
function stat(l,v,n='',h=''){return `<div class="stat-box"><div class="label">${l} ${h?tip(h):''}</div><div class="value">${v}</div>${n?`<div class="note">${n}</div>`:''}</div>`}
function usd(x){return x==null?'—':'$'+Number(x).toLocaleString(undefined,{maximumFractionDigits:0})}
function src(){return `<div class="card source-card"><h2>Veri Kaynakları</h2><div class="source-list"><div class="source-item"><div class="source-label">VIX ailesi</div><div class="source-value">Yahoo Finance: ^VIX, ^VIX9D ve ^VIX3M fiyat serileri.</div></div><div class="source-item"><div class="source-label">BTC Opsiyon</div><div class="source-value">Deribit public opsiyon zinciri: Max Pain, OI yoğunluğu, Put/Call, IV ve kendi hesapladığımız GEX / Zero Gamma proxy.</div></div><div class="source-item"><div class="source-label">Vade yapısı</div><div class="source-value">VIX, VIX9D ve VIX3M seviyelerinden Python tarafında contango/backwardation yorumu üretilir.</div></div><div class="source-item"><div class="source-label">Önemli sınır</div><div class="source-value">BTC GEX ve Zero Gamma dealer pozisyon yönü bilinmediği için tahmini proxy'dir; call pozitif, put negatif gamma varsayımı kullanılır.</div></div></div></div>`}
function rows(x){if(!x||!x.length)return'';return `<div class="rows">${x.map(r=>`<div class="rowx"><b>${usd(r.strike)}</b><span>C OI ${Number(r.call_oi||0).toFixed(1)}</span><span>P OI ${Number(r.put_oi||0).toFixed(1)}</span><span>${r.gex_musd!=null?'GEX '+(r.gex_musd>=0?'+':'')+Number(r.gex_musd).toFixed(2)+'M':'OI '+Number(r.total_oi||0).toFixed(1)}</span></div>`).join('')}</div>`}
function expiries(x){if(!x||!x.length)return'';return `<div class="rows">${x.map(r=>`<div class="rowx"><b>${new Date(r.expiry).toLocaleDateString('tr-TR')}</b><span>${Number(r.share_pct||0).toFixed(1)}%</span><span>C ${Number(r.call_oi||0).toFixed(1)}</span><span>P ${Number(r.put_oi||0).toFixed(1)}</span></div>`).join('')}</div>`}
function btcOptions(d){if(!d)return `<div class="card btc-options"><h2>₿ BTC Opsiyon</h2><div class="note">BTC opsiyon verisi alınamadı.</div></div>`;let mp=d.max_pain||{},o=d.btc_options||{},g=o.net_gex_musd??d.gex_musd,iv=d.iv_rank_pct,cur=d.current_iv;let gamma=g==null?'—':`${g>=0?'+':'-'}$${Math.abs(g).toFixed(2)}M`;return `<div class="card btc-options"><h2>₿ BTC Opsiyon · Deribit</h2><div class="stat-grid">${stat('BTC Index',usd(o.spot||mp.spot),'','Deribit BTC index fiyatı.')}${stat('Max Pain',mp.strike!=null?usd(mp.strike):'—',mp.expiry?new Date(mp.expiry).toLocaleDateString('tr-TR'):'','Yakın vade için teorik minimum toplam opsiyon ödeme seviyesi; fiyat hedefi değildir.')}${stat('Call Wall',usd(o.call_wall),'En yüksek Call OI strike','Zincirde Call açık pozisyonunun en yoğun olduğu strike.')}${stat('Put Wall',usd(o.put_wall),'En yüksek Put OI strike','Zincirde Put açık pozisyonunun en yoğun olduğu strike.')}${stat('Zero Gamma ~',usd(o.zero_gamma),'Tahmini geçiş seviyesi','Net GEX proxy işaretinin değiştiği yaklaşık spot seviyesi.')}${stat('Net GEX ~',gamma,g==null?'':(g>=0?'Pozitif gamma rejimi':'Negatif gamma rejimi'),'Call + / Put − varsayımı ile Deribit OI ve Black-Scholes gamma üzerinden proxy.')}${stat('Put/Call OI',mp.put_call_ratio!=null?Number(mp.put_call_ratio).toFixed(2):'—','','Yakın vade Put açık pozisyonunun Call açık pozisyonuna oranı.')}${stat('IV Percentile',iv!=null?Number(iv).toFixed(1)+'%':'—',cur!=null?'HV/vol serisi '+Number(cur).toFixed(1):'','Mevcut volatilite seviyesinin tarihsel dağılımdaki yüzdeliği.')}</div><div class="btc-note warn">GEX ve Zero Gamma gerçek dealer envanteri değildir. Public zincirde pozisyon sahibinin long/short yönü bilinmediği için bunlar mekanik proxy'dir; spot/CVD/OI/funding ile teyit edilmelidir.</div>${o.strike_gex?.length?`<div class="sep"></div><h3>En Büyük Strike GEX / OI Yoğunlukları</h3>${rows(o.strike_gex)}`:''}${o.expiry_concentration?.length?`<div class="sep"></div><h3>Vade OI Yoğunluğu</h3>${expiries(o.expiry_concentration)}`:''}</div>`}
async function load(){try{let [o,cd]=await Promise.all([fetch('../data/options.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('../data/crypto_derivatives.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json())]);updated.textContent='Güncelleme: '+new Date(Math.max(new Date(o.generated_at||0),new Date(cd.generated_at||0))).toLocaleString('tr-TR');content.innerHTML=btcOptions(cd)+`<div class="card"><h2>Volatilite Eğrisi ${tip('Farklı vadelerdeki beklenen volatilite seviyelerini karşılaştırır. Normal piyasada uzun vade genellikle kısa vadeden daha yüksektir.')}</h2><div class="stat-grid">${b('vix9d','VIX9D',o)}${b('vix','VIX',o)}${b('vix3m','VIX3M',o)}</div><div class="badge" style="margin-top:16px">${o.term_structure||'Vade yapısı hesaplanamadı'} ${tip('Contango: uzun vadeli volatilite kısa vadeden yüksek; normal yapı. Backwardation: kısa vadeli volatilite daha yüksek; stres işareti olabilir.')}</div></div>`+src()}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+src()}}load()</script></body></html>
