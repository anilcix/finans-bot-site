<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://project-alpha-terminal.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests">
<title>Tarayıcı — Piyasa İstihbarat Ağı</title>
<link rel="stylesheet" href="../style.css">
<style>
.reading{min-width:230px;white-space:normal;line-height:1.45}.mini{font-size:9px;color:var(--muted)}
.cvd-dots{display:flex;gap:5px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.g{background:#39ff88;box-shadow:0 0 8px rgba(57,255,136,.35)}.dot.r{background:#ff5c5c;box-shadow:0 0 8px rgba(255,92,92,.25)}
.signal-note{font-size:10px;font-weight:700;color:#dfffea}.statline{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.statpill{border:1px solid var(--green-dim);border-radius:999px;padding:5px 8px;font-size:9px;color:var(--muted)}
.dir-up{font-weight:800;color:#39ff88}.dir-down{font-weight:800;color:#ff7070}.dir-wait{font-weight:700;color:#f2cc60}
.history-note{font-size:10px;color:var(--muted);line-height:1.55;margin-top:10px}.nowrap{white-space:nowrap}.horizon{min-width:112px}
.horizon-title{font-size:10px;font-weight:800;margin-top:10px;color:#dfffea}.fresh{color:#39ff88}.stale{color:#ffcf5c}
</style>
<script data-security-frameguard>try{if(window.top!==window.self){window.top.location=window.self.location.href}}catch(e){document.documentElement.style.display="none"}</script>
</head>
<body>
<div class="topbar"><a class="back" href="../index.html">← Ana Ağa Dön</a><span class="updated" id="updated">Yükleniyor…</span></div>
<div class="page-header"><h1>🔍 TARAYICI</h1><p>Top 200 Coin · 10dk Hacim Z-Score · Spot CVD · +15dk / +30dk Sonuç Takibi</p></div>
<div class="container" id="content"></div>
<script src="../help.js"></script>
<script>
function money(v){if(v==null)return'—';v=Number(v);if(!Number.isFinite(v))return'—';if(Math.abs(v)>=1e9)return(v<0?'−':'')+'$'+(Math.abs(v)/1e9).toFixed(2)+'B';if(Math.abs(v)>=1e6)return(v<0?'−':'')+'$'+(Math.abs(v)/1e6).toFixed(1)+'M';if(Math.abs(v)>=1e3)return(v<0?'−':'')+'$'+(Math.abs(v)/1e3).toFixed(1)+'K';return(v<0?'−':'')+'$'+Math.abs(v).toFixed(4).replace(/\.0+$/,'')}
function pct(v,d=1){if(v==null||!Number.isFinite(Number(v)))return'—';return`${Number(v)>=0?'+':''}${Number(v).toFixed(d)}%`}
function num(v,d=2){return v==null||!Number.isFinite(Number(v))?'—':Number(v).toFixed(d)}
function dt(v){if(!v)return'—';try{return new Date(v).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return'—'}}
function dots(a){return `<div class="cvd-dots">${(a||[]).map(x=>`<span class="dot ${x.green?'g':'r'}" title="${money(x.delta_usd)}"></span>`).join('')}</div>`}
function histDirection(x,m){const v=x[`change_${m}m_pct`];if(v==null)return'<span class="dir-wait">⏳ BEKLİYOR</span>';if(Number(v)>0)return'<span class="dir-up">↑ YUKARI</span>';if(Number(v)<0)return'<span class="dir-down">↓ AŞAĞI</span>';return'<span>→ YATAY</span>'}
function activeCard(d){const rows=d.movers||[],m=d.scan_meta||{};const status=d.error?`<div class="error-box">⚠️ Tarama tamamlanamadı: ${d.error}</div>`:rows.length?`<div class="table-wrap"><table class="data-table"><tr><th>Coin ${tip('CoinGecko piyasa değeri Top 200 evreninden kriterleri geçen coin.')}</th><th>10dk Vol Z</th><th>Alıcı Payı</th><th>10dk Hacim</th><th>10dk Fiyat</th><th>Spot Delta</th><th>Son 3 CVD</th><th>Not</th></tr>${rows.map(x=>`<tr><td><b>${x.symbol}</b><div class="mini">${x.name||''} · ${money(x.price)} · 24s ${pct(x.change_24h)}</div></td><td class="positive"><b>${num(x.volume_zscore_10m)}</b></td><td class="positive"><b>${num(x.buyer_share_pct,1)}%</b><div class="mini">Buy ${money(x.taker_buy_10m_usd)} · Sell ${money(x.taker_sell_10m_usd)}</div></td><td>${money(x.volume_10m_usd)}</td><td class="${Number(x.price_change_10m_pct)>=0?'positive':'negative'}">${pct(x.price_change_10m_pct,2)}</td><td class="${Number(x.spot_delta_10m_usd)>=0?'positive':'negative'}">${money(x.spot_delta_10m_usd)}</td><td>${dots(x.cvd_last3)}<div class="mini">30dk ${money(x.cvd_30m_delta_usd)}</div></td><td class="reading"><span class="signal-note">${x.cvd_note||'—'}</span></td></tr>`).join('')}</table></div>`:`<div class="empty">Tarama tamamlandı; şu an bütün kriterleri aynı anda geçen coin yok.</div>`;return `<div class="card"><h2>Aktif Spot Akış Sinyalleri ${tip('Z ≥ 2.0, alıcı payı ≥ %65 ve 10dk Spot CVD delta > 0. Otomatik alım önerisi değildir.')}</h2><div class="note">${d.rule||'Top 200 → 10dk hacim Z-score + güçlü taker alıcı baskısı + pozitif Spot CVD'} · ${d.window||'10m'}</div><div class="statline"><span class="statpill">Top200: ${m.top200_received??'—'}</span><span class="statpill">Binance Spot: ${m.binance_spot_matched??'—'}</span><span class="statpill">Taranan: ${m.scanned??'—'}</span><span class="statpill">Sinyal: ${m.signal_count_before_cap??rows.length}</span><span class="statpill">Evren: ${m.universe_mode||'—'}</span></div>${status}</div>`}
function metricRow(label,s){s=s||{};return `<div class="horizon-title">${label}</div><div class="statline"><span class="statpill">Tamamlanan: ${s.completed??0}</span><span class="statpill">Bekleyen: ${s.pending??0}</span><span class="statpill">Yukarı oranı: ${pct(s.up_rate_pct,1)}</span><span class="statpill">Ortalama: ${pct(s.avg_change_pct,2)}</span><span class="statpill">Medyan: ${pct(s.median_change_pct,2)}</span><span class="statpill">En iyi: ${pct(s.best_change_pct,2)}</span><span class="statpill">En kötü: ${pct(s.worst_change_pct,2)}</span></div>`}
function historyCard(h){const s=h.summary||{},s15=s['15m']||{completed:s.completed,pending:s.pending,up_rate_pct:s.up_rate_pct,avg_change_pct:s.avg_change_15m_pct,median_change_pct:s.median_change_15m_pct,best_change_pct:s.best_change_15m_pct,worst_change_pct:s.worst_change_15m_pct},s30=s['30m']||{completed:s.completed,pending:s.pending,avg_change_pct:s.avg_change_30m_pct,median_change_pct:s.median_change_30m_pct,best_change_pct:s.best_change_30m_pct,worst_change_pct:s.worst_change_30m_pct};const rows=(h.events||[]).slice(0,100);const table=rows.length?`<div class="table-wrap"><table class="data-table"><tr><th>Ekrana Düştü</th><th>Coin</th><th>Vol Z</th><th>Alıcı</th><th>CVD</th><th>+15dk</th><th>+30dk</th><th>Fiyat İzi</th></tr>${rows.map(x=>`<tr><td class="nowrap">${dt(x.detected_at)}</td><td><b>${x.symbol||'—'}</b></td><td>${num(x.volume_zscore_10m)}</td><td>${x.buyer_share_pct==null?'—':num(x.buyer_share_pct,1)+'%'}</td><td class="${Number(x.spot_delta_10m_usd)>=0?'positive':'negative'}">${money(x.spot_delta_10m_usd)}</td><td class="horizon">${histDirection(x,15)}<div><b>${pct(x.change_15m_pct,2)}</b></div></td><td class="horizon">${histDirection(x,30)}<div><b>${pct(x.change_30m_pct,2)}</b></div></td><td><span class="mini">${money(x.entry_price)} → ${money(x.price_15m)} → ${money(x.price_30m)}</span></td></tr>`).join('')}</table></div>`:`<div class="empty">Henüz tarihsel kayıt yok.</div>`;return `<div class="card"><h2>Tarayıcı Sonrası +15dk / +30dk Tarihçe</h2>${metricRow('+15 dakika',s15)}${metricRow('+30 dakika',s30)}${table}<div class="history-note">Coin ilk kez sinyale düştüğünde kayıt açılır; +15 ve +30 dakika sonuçları hedef zamandaki Binance 1dk kapanışından ölçülür.</div></div>`}
function methodCard(){return `<div class="card"><h2>Aktif Strateji</h2><div class="note">CoinGecko piyasa değerine göre Top 200 → Binance Spot USDT → tamamlanmış 5dk mumları 10dk birleştir → son 20 adet 10dk BASE volume ile Z-score → taker buyer payı → Spot CVD. Eşikler: <b>Z ≥ 2.0</b>, <b>alıcı payı ≥ %65</b>, <b>Spot CVD delta &gt; 0</b>.</div></div>`}
function sourceCard(){return `<div class="card source-card"><h2>Veri Kaynakları</h2><div class="source-list"><div class="source-item"><div class="source-label">Evren</div><div class="source-value">CoinGecko · piyasa değerine göre Top 200.</div></div><div class="source-item"><div class="source-label">Spot akış</div><div class="source-value">Binance Spot public market-data API.</div></div><div class="source-item"><div class="source-label">Yayın</div><div class="source-value">Tarama sonucu 10 dakikalık veri döngüsünde siteye yayınlanır.</div></div></div></div>`}
async function load(){try{const ts=Date.now();const [dr,hr]=await Promise.all([fetch('../data/screener.json?t='+ts,{cache:'no-store'}),fetch('../data/screener_history.json?t='+ts,{cache:'no-store'}).catch(()=>null)]);if(!dr.ok)throw new Error('tarayıcı verisi alınamadı');const d=await dr.json();if(!d||!d.generated_at)throw new Error('tarayıcı verisi geçersiz');let h={events:[],summary:{}};if(hr&&hr.ok)h=await hr.json();const age=Date.now()-new Date(d.generated_at).getTime();updated.className='updated '+(age<=25*60*1000?'fresh':'stale');updated.textContent='Güncelleme: '+new Date(d.generated_at).toLocaleString('tr-TR');content.innerHTML=activeCard(d)+historyCard(h)+methodCard()+sourceCard()}catch(e){content.innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`+sourceCard()}}
load();setInterval(load,600000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script>
<script src="../screener_live.js"></script></body>
</html>
