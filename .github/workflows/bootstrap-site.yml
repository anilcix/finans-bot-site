name: Bootstrap Public Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-site.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-public-site
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone public site repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site

      - name: Copy only public presentation layer
        run: |
          git clone --depth 1 https://github.com/anilcix/finans-bot.git core-public
          cp -R core-public/docs/. site/
          cp core-public/LICENSE site/LICENSE
          cp core-public/TERMS.md site/TERMS.md
          touch site/.nojekyll
          rm -rf core-public

      - name: Verify private core code was not copied
        run: |
          test ! -d site/common
          test ! -f site/generate_site_data.py
          test ! -f site/main.py
          if find site -type f -name '*.py' -print -quit | grep -q .; then
            echo "Python source detected in public site; aborting."
            exit 1
          fi
          if find site/agents -type f ! -name '*.html' -print -quit 2>/dev/null | grep -q .; then
            echo "Unexpected non-HTML file detected under public agents/."
            exit 1
          fi

      - name: Commit public site snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No site changes."
            exit 0
          fi
          git commit -m "chore: import public site layer"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
